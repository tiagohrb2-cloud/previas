<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1d30">
<title>Portões da Batalha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root{color-scheme:dark;--bg:#0a1d30;--panel:rgba(14,22,40,.95);--panel2:rgba(255,255,255,.06);--txt:#fff;--mut:rgba(255,255,255,.65);
    --go:#e8394a;--go-dk:#9d1726;--gold:#ffc93c;--gold-dk:#2a1c00;--ok:#5fe08f;--bad:#ff6b6b;--blue:#4c9bff}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--txt);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;box-sizing:border-box;
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
  canvas{display:block}
  .ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;box-sizing:border-box;
    padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
    background:rgba(5,10,20,.6)}
  .ov.show{display:flex}
  .card{background:var(--panel);border:2px solid rgba(255,255,255,.08);border-radius:22px;padding:18px 16px;
    width:min(360px,100%);max-height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  h1{margin:0;font-size:27px;font-weight:900;letter-spacing:.5px;color:var(--txt)}
  h2{margin:0;font-size:30px;font-weight:900}
  .sub{color:var(--mut);font-size:13px;margin:0;line-height:1.4}
  .money{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:900;color:var(--gold);font-size:22px}
  .coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,var(--gold) 50%,#c48a00);display:inline-block;flex:none}
  .sec{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);text-align:left;margin:2px 0 -4px}
  .list{display:grid;gap:7px;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch;padding-right:2px}
  .it{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel2);border-radius:14px;padding:9px 10px;text-align:left;border:2px solid transparent}
  .it.eq{border-color:var(--blue)}
  .it.lock{opacity:.6}
  .it b{display:block;font-size:15px}
  .it small{color:var(--mut);font-size:11.5px;display:block;margin-top:2px}
  .bars{display:flex;gap:8px;margin-top:4px;font-size:10.5px;color:var(--mut)}
  .bar{display:inline-block;width:34px;height:5px;border-radius:3px;background:rgba(255,255,255,.12);vertical-align:middle;margin-left:3px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--ok)}
  .btn{border:0;border-radius:10px;padding:8px 10px;font-weight:800;font-size:13px;color:var(--gold-dk);background:var(--gold);min-width:86px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:5px;flex:none;font-family:inherit}
  .btn.eqb{background:var(--blue);color:#fff}
  .btn.on{background:transparent;color:var(--blue);border:2px solid var(--blue)}
  .btn:disabled{background:#4a4f5a;color:#9aa0aa;cursor:default}
  .btn:focus-visible,.play:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .play{width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:20px;font-weight:900;color:#fff;font-family:inherit;flex:none;
    background:var(--go);box-shadow:0 5px 0 var(--go-dk);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
  .play:active{transform:translateY(3px);box-shadow:0 2px 0 var(--go-dk)}
  .win h2{color:var(--ok)}.lose h2{color:var(--bad)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stats div{background:var(--panel2);border-radius:12px;padding:8px}
  .stats b{display:block;font-size:20px}
  .stats span{font-size:11px;color:var(--mut)}
</style>
</head>
<body>

<div id="wrap">
  <canvas id="c"></canvas>

  <div class="ov show" id="menu">
    <div class="card">
      <h1>PORTÕES DA BATALHA</h1>
      <p class="sub">Arraste para mover. Seu esquadrão atira sozinho.<br>Passe pelos portões azuis para ganhar soldados. Atire neles para aumentar o valor!<br>Fuja dos vermelhos.</p>
      <div class="money"><span class="coin"></span><span id="mMoney">0</span></div>
      <div class="sec">Armas</div>
      <div class="list" id="shop"></div>
      <button class="play" id="btnPlay"><span id="playLbl">Jogar · Fase 1</span><span>›</span></button>
    </div>
  </div>

  <div class="ov" id="end">
    <div class="card" id="endCard">
      <h2 id="endTitle">Vitória!</h2>
      <p class="sub" id="endSub"></p>
      <div class="stats">
        <div><b id="stKills">0</b><span>inimigos abatidos</span></div>
        <div><b id="stMoney" style="color:var(--gold)">0</b><span>dinheiro ganho</span></div>
      </div>
      <button class="play" id="btnNext"><span>Loja de armas</span><span>›</span></button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const W = 400, H = 760, TL = 40, TR = 360, MID = (TL + TR) / 2, SQY = 610;
const SCROLL = 62, MAX_SQ = 120, MAX_BUL = 480, PERIOD = 104;

const WEAPONS = [
  { id: 'pistola',  name: 'Pistola',          price: 0,     dmg: 1,   rate: 3, pel: 1, spr: .03, spd: 520, pierce: 0, splash: 0,  col: '#ffe27a', kind: 'bullet' },
  { id: 'smg',      name: 'Submetralhadora',  price: 150,   dmg: 1,   rate: 5.5, pel: 1, spr: .07, spd: 560, pierce: 0, splash: 0,  col: '#ffd34d', kind: 'bullet' },
  { id: 'escopeta', name: 'Escopeta',         price: 450,   dmg: 1.4, rate: 1.7, pel: 5, spr: .34, spd: 500, pierce: 0, splash: 0,  col: '#ffb347', kind: 'bullet' },
  { id: 'fuzil',    name: 'Fuzil de Assalto', price: 1100,  dmg: 3.2, rate: 3.8, pel: 1, spr: .02, spd: 680, pierce: 1, splash: 0,  col: '#fff1b8', kind: 'bullet' },
  { id: 'metra',    name: 'Metralhadora',     price: 2600,  dmg: 2.6, rate: 9,   pel: 1, spr: .08, spd: 640, pierce: 0, splash: 0,  col: '#ffcf33', kind: 'bullet' },
  { id: 'bazuca',   name: 'Bazuca',           price: 5500,  dmg: 9,   rate: 1.5, pel: 1, spr: .02, spd: 380, pierce: 0, splash: 36, col: '#ff7a2f', kind: 'rocket' },
  { id: 'laser',    name: 'Rifle Laser',      price: 11000, dmg: 7,   rate: 7,   pel: 1, spr: .01, spd: 900, pierce: 4, splash: 0,  col: '#5ff3ff', kind: 'laser'  },
  { id: 'minigun',  name: 'Minigun Dourada',  price: 22000, dmg: 7,   rate: 16,  pel: 1, spr: .1,  spd: 720, pierce: 1, splash: 0,  col: '#ffe066', kind: 'bullet' },
];
const RECRUIT = { name: 'Recrutas iniciais', base: 120, max: 10 };
const dps = w => w.dmg * w.rate * w.pel * (1 + w.pierce * .5) * (w.splash ? 2.2 : 1);
const MAXDPS = Math.max(...WEAPONS.map(dps));

// ---------- save ----------
const KEY = 'portoes_batalha_v2';
let save = { phase: 1, money: 0, owned: ['pistola'], weapon: 'pistola', recruits: 0, best: 1 };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.owned) save = Object.assign(save, s); } catch (e) {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} };
const recruitCost = () => Math.round(RECRUIT.base * Math.pow(1.75, save.recruits));
const weapon = () => WEAPONS.find(w => w.id === save.weapon) || WEAPONS[0];

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? (n / 1e3).toFixed(1) + 'K' : String(Math.floor(n));
function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }; }

// ---------- canvas ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1, dpr = 1, bg, SPR = {};

function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const wr = document.getElementById('wrap'), cs = getComputedStyle(wr);
  const aw = wr.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = wr.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  scale = Math.min(aw / W, ah / H);
  cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
  buildBg(); buildSprites();
}

function buildBg() {
  const k = scale * dpr;
  bg = document.createElement('canvas'); bg.width = Math.ceil(W * k); bg.height = Math.ceil((H + PERIOD) * k);
  const c = bg.getContext('2d'); c.scale(k, k);
  const HH = H + PERIOD;
  c.fillStyle = '#0b2540'; c.fillRect(0, 0, W, HH);
  const r = rng(3); c.strokeStyle = 'rgba(120,180,230,.14)'; c.lineWidth = 1.2;
  for (let band = 0; band < HH; band += PERIOD) for (let i = 0; i < 6; i++) {
    const rr = rng(i * 31 + 5); const x = rr() * W, y = band + rr() * PERIOD, w = 8 + rr() * 14;
    if (x > TL - 20 && x < TR + 20) continue;
    c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + w / 2, y - 3, x + w, y); c.stroke();
  }
  c.fillStyle = '#3e4756'; c.fillRect(TL - 16, 0, TR - TL + 32, HH);
  c.fillStyle = '#566174'; c.fillRect(TL - 16, 0, 10, HH); c.fillRect(TR + 6, 0, 10, HH);
  for (let y = 0; y < HH; y += 26) {
    c.fillStyle = '#76829a'; c.fillRect(TL - 18, y + 4, 12, 12); c.fillRect(TR + 6, y + 4, 12, 12);
    c.fillStyle = '#2c333f'; c.fillRect(TL - 18, y + 16, 12, 3); c.fillRect(TR + 6, y + 16, 12, 3);
  }
  c.fillStyle = '#b8bfca'; c.fillRect(TL, 0, TR - TL, HH);
  c.strokeStyle = 'rgba(80,90,110,.2)'; c.lineWidth = 1;
  for (let y = 0, row = 0; y < HH; y += 26, row++) {
    c.beginPath(); c.moveTo(TL, y); c.lineTo(TR, y); c.stroke();
    for (let x = TL + (row % 2 ? 0 : 20); x < TR; x += 40) { c.beginPath(); c.moveTo(x, y); c.lineTo(x, y + 26); c.stroke(); }
  }
  c.fillStyle = 'rgba(0,0,0,.06)'; c.fillRect(MID - 1, 0, 2, HH);
  for (const [x0, dir] of [[TL, 1], [TR, -1]]) {
    const g = c.createLinearGradient(x0, 0, x0 + 14 * dir, 0); g.addColorStop(0, 'rgba(0,0,0,.25)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g; c.fillRect(Math.min(x0, x0 + 14 * dir), 0, 14, HH);
  }
}

function sprite(size, draw) {
  const k = scale * dpr, s = document.createElement('canvas');
  s.width = s.height = Math.ceil(size * k);
  const c = s.getContext('2d'); c.scale(k, k); draw(c, size / 2); return s;
}
function person(c, m, o) {
  // o: body, dark, head, legs phase, gun, big, eyes
  const L = o.leg;
  c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(m, m + 6 * o.s, 6 * o.s, 2.6 * o.s, 0, 0, 7); c.fill();
  c.fillStyle = o.dark;
  c.fillRect(m - 3.4 * o.s, m + (2 + L) * o.s, 2.4 * o.s, 4 * o.s);
  c.fillRect(m + 1 * o.s, m + (2 - L) * o.s, 2.4 * o.s, 4 * o.s);
  c.fillStyle = o.body; c.strokeStyle = o.dark; c.lineWidth = 1.1 * o.s;
  c.beginPath(); c.arc(m, m + 1 * o.s, 4.6 * o.s, 0, 7); c.fill(); c.stroke();
  c.fillStyle = o.head; c.beginPath(); c.arc(m, m - 3.2 * o.s, 3.2 * o.s, 0, 7); c.fill(); c.stroke();
  if (o.gun) { c.fillStyle = '#1d2230'; c.fillRect(m + 2.6 * o.s, m - 7 * o.s, 2.2 * o.s, 8 * o.s); }
  if (o.eyes) { c.fillStyle = '#e0162b'; c.fillRect(m - 2 * o.s, m - 3.8 * o.s, 1.4 * o.s, 1.4 * o.s); c.fillRect(m + .6 * o.s, m - 3.8 * o.s, 1.4 * o.s, 1.4 * o.s); }
  if (o.crown) { c.fillStyle = '#ffc93c'; c.beginPath(); c.moveTo(m - 3 * o.s, m - 5 * o.s); c.lineTo(m - 3 * o.s, m - 8.5 * o.s); c.lineTo(m - 1.5 * o.s, m - 6.5 * o.s);
    c.lineTo(m, m - 9 * o.s); c.lineTo(m + 1.5 * o.s, m - 6.5 * o.s); c.lineTo(m + 3 * o.s, m - 8.5 * o.s); c.lineTo(m + 3 * o.s, m - 5 * o.s); c.fill(); }
}
function buildSprites() {
  for (const f of [0, 1]) {
    const leg = f ? 1.2 : -1.2;
    SPR['b' + f] = sprite(20, (c, m) => person(c, m, { s: 1, leg, body: '#2f7bea', dark: '#123a80', head: '#a9d0ff', gun: true }));
    SPR['L' + f] = sprite(30, (c, m) => person(c, m, { s: 1.45, leg, body: '#1e5fd0', dark: '#0b2a66', head: '#ffd9b0', gun: true, crown: true }));
    SPR['e' + f] = sprite(20, (c, m) => person(c, m, { s: 1, leg, body: '#f4f5f7', dark: '#7c8291', head: '#ffffff', eyes: true }));
    SPR['h' + f] = sprite(20, (c, m) => person(c, m, { s: 1, leg, body: '#ffb3b3', dark: '#a33', head: '#ffd0d0', eyes: true }));
    SPR['B' + f] = sprite(80, (c, m) => person(c, m, { s: 4.2, leg, body: '#eceef2', dark: '#5f6573', head: '#ffffff', eyes: true }));
  }
}

// ---------- jogo ----------
let G = null, state = 'menu';

function diff(p) {
  return {
    hp: Math.round(1 + (p - 1) * 1.5 + (p - 1) * (p - 1) * .18),
    flux: 0.9 + p * 0.95,
    espd: 58 + p * 3,
    len: 2500 + p * 160,
    bossHP: Math.round(70 * Math.pow(p, 1.65)),
    gateNeed: 8 + p * 2,
    coin: 1 + Math.floor(p / 3),
  };
}

function start() {
  const p = save.phase, D = diff(p);
  G = {
    p, D, t: 0, dist: 0, money: 0, kills: 0,
    lx: MID, tx: MID, members: [], enemies: [], bullets: [], gates: [], parts: [], pops: [], coins: [],
    boss: null, waveT: 4, gateT: .4, fireAcc: 0, shotIdx: 0, shake: 0, hint: true, endT: 0, eid: 0, bossT: 0,
  };
  for (let i = 0; i < 1 + save.recruits; i++) G.members.push({ x: MID, y: SQY });
  state = 'play';
}

function slot(i) { if (!i) return [0, 0]; const r = 7.2 * Math.sqrt(i), a = i * 2.39996; return [Math.cos(a) * r, Math.sin(a) * r * .75]; }
function squadR() { return Math.min(7.2 * Math.sqrt(G.members.length) + 6, (TR - TL) / 2 - 6); }

function addMembers(n) {
  for (let i = 0; i < n && G.members.length < MAX_SQ; i++) G.members.push({ x: G.lx + rand(-6, 6), y: SQY + rand(-6, 6) });
}
function killMember(x, y) {
  puff(x, y, '#4c9bff', 6);
  if (G.members.length <= 1) { G.members.length = 0; finish(false); return; }
  G.members.pop();
}

function puff(x, y, color, n) {
  for (let i = 0; i < n && G.parts.length < 500; i++) {
    const a = Math.random() * 6.28, s = rand(25, 100);
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(.2, .5), max: .5, color, r: rand(1.2, 2.8) });
  }
}
function pop(x, y, text, color, size) { if (G.pops.length < 40) G.pops.push({ x, y, text, color, life: .9, size: size || 16 }); }

function spawnWave() {
  const n = Math.round(rand(2, 5) + G.p * 1.1 + G.t / 12);
  const cx = rand(TL + 40, TR - 40);
  for (let i = 0; i < n; i++) {
    const hp = G.D.hp;
    G.enemies.push({ id: ++G.eid, x: clamp(cx + rand(-45, 45), TL + 6, TR - 6), y: -10 - rand(0, 70), hp, max: hp,
      spd: G.D.espd + rand(0, 22), vx: 0, ph: Math.random() * 6, hitT: 0 });
  }
  G.waveT = n / (G.D.flux * (.45 + .55 * Math.min(1, G.t / 25)));
}

function gateVal(r) {
  const p = G.p;
  if (r < (p < 3 ? .1 : .16)) return { op: 'x', v: p >= 4 && Math.random() < .3 ? 3 : 2 };
  const adds = p < 3 ? [1, 2, 2, 3] : p < 6 ? [2, 3, 4, 5] : [3, 5, 6, 8];
  return { op: '+', v: adds[(Math.random() * adds.length) | 0] };
}
function spawnGates() {
  const side = Math.random() < .5 ? 0 : 1;
  const stack = 1 + Math.floor(rand(0, Math.min(4, 2 + G.p / 3)));
  let hadX = false;
  for (let i = 0; i < stack; i++) {
    let g = gateVal(Math.random());
    if (g.op === 'x') { if (hadX) g = { op: '+', v: 2 }; hadX = true; }
    G.gates.push(mkGate(side, -30 - i * 52, g.op, g.v));
  }
  if (G.p >= 2 && Math.random() < .45) G.gates.push(mkGate(1 - side, -30 - rand(0, (stack - 1) * 52), '-', 1 + Math.floor(rand(1, 2 + G.p * .8))));
  G.gateT = rand(3.6, 5.2) + stack * .5;
}
function mkGate(side, y, op, v) {
  const x1 = side ? MID + 3 : TL + 4, x2 = side ? TR - 4 : MID - 3;
  return { x1, x2, y, op, v, prog: 0, ups: 0, used: false, flash: 0, fade: 1 };
}

function shoot(w) {
  const N = G.members.length; if (!N) return;
  const shooters = Math.min(N, 22), mult = N / shooters;
  G.fireAcc += w.rate * shooters * G.dt;
  let guard = 0;
  while (G.fireAcc >= 1 && guard++ < 80) {
    G.fireAcc -= 1;
    const m = G.members[G.shotIdx++ % shooters];
    for (let k = 0; k < w.pel; k++) {
      if (G.bullets.length >= MAX_BUL) break;
      const a = -Math.PI / 2 + (w.pel > 1 ? (k / (w.pel - 1) - .5) * w.spr : 0) + rand(-w.spr, w.spr) * (w.pel > 1 ? .25 : 1);
      G.bullets.push({ x: m.x + 3, y: m.y - 8, vx: Math.cos(a) * w.spd, vy: Math.sin(a) * w.spd,
        dmg: w.dmg * mult, pierce: w.pierce, last: 0, w });
    }
  }
}

function damageEnemy(e, dmg) {
  e.hp -= dmg; e.hitT = .08;
  if (e.hp <= 0 && !e.dead) {
    e.dead = true; G.kills++;
    G.money += G.D.coin;
    puff(e.x, e.y, '#ffffff', 5);
    if (G.coins.length < 60) G.coins.push({ x: e.x, y: e.y, t: 0 });
  }
}

const grid = new Map(), CELL = 20;
function gkey(cx, cy) { return cy * 64 + cx; }

function update(dt) {
  G.dt = dt; G.t += dt;
  G.shake = Math.max(0, G.shake - dt * 22);
  const w = weapon(), playing = state === 'play';

  if (playing && !G.boss) {
    G.dist += SCROLL * dt;
    if (G.dist >= G.D.len) {
      G.boss = { x: MID, y: -50, hp: G.D.bossHP, max: G.D.bossHP, r: 30, spd: 24 + G.p, ph: 0, atkT: 0, hitT: 0 };
      pop(MID, 200, 'CHEFÃO!', '#ff6b6b', 34); G.shake = 8;
    }
  }
  if (playing && !G.boss) {
    G.waveT -= dt; if (G.waveT <= 0) spawnWave();
    G.gateT -= dt; if (G.gateT <= 0 && G.dist < G.D.len - 500) spawnGates();
  } else if (playing && G.boss) {
    G.waveT -= dt; if (G.waveT <= 0) { spawnWave(); G.waveT *= 2.5; }
  }

  // esquadrão
  const R = squadR();
  G.tx = clamp(G.tx, TL + R, TR - R);
  G.lx += (G.tx - G.lx) * Math.min(1, dt * 16);
  G.members.forEach((m, i) => { const [ox, oy] = slot(i); m.x += (G.lx + ox - m.x) * Math.min(1, dt * 12); m.y += (SQY + oy - m.y) * Math.min(1, dt * 12); });
  if (playing) shoot(w);

  // portões
  for (const g of G.gates) {
    g.y += SCROLL * dt; g.flash = Math.max(0, g.flash - dt);
    if (g.used) g.fade -= dt * 3;
    if (!g.used && g.y >= SQY - 4) {
      g.used = true;
      if (playing && G.lx >= g.x1 && G.lx <= g.x2) {
        const N = G.members.length;
        if (g.op === '+') { addMembers(g.v); pop(G.lx, SQY - 40, '+' + g.v, '#9cd0ff', 22); }
        else if (g.op === 'x') { addMembers(N * (g.v - 1)); pop(G.lx, SQY - 40, 'X' + g.v, '#9cd0ff', 26); }
        else { for (let i = 0; i < g.v && state === 'play'; i++) killMember(G.lx + rand(-R, R), SQY + rand(-10, 10)); pop(G.lx, SQY - 40, '−' + g.v, '#ff8080', 22); }
        g.flash = .2;
      }
    }
  }
  G.gates = G.gates.filter(g => g.fade > 0 && g.y < H + 40);

  // inimigos
  for (const e of G.enemies) {
    e.y += e.spd * dt; e.ph += dt * 12; e.hitT = Math.max(0, e.hitT - dt);
    if (e.y > 200) { const d = clamp((G.lx - e.x) * 1.4, -75, 75); e.vx += (d - e.vx) * dt * 3; }
    e.x = clamp(e.x + e.vx * dt, TL + 6, TR - 6);
    if (e.y > H + 20) e.dead = true;
    if (playing && !e.dead && Math.abs(e.y - SQY) < R + 14 && Math.abs(e.x - G.lx) < R + 14) {
      for (const m of G.members) {
        const dx = m.x - e.x, dy = m.y - e.y;
        if (dx * dx + dy * dy < 120) { e.dead = true; puff(e.x, e.y, '#ffffff', 4); G.shake = Math.max(G.shake, 3); killMember(m.x, m.y); break; }
      }
    }
  }

  // chefão
  const B = G.boss;
  if (B && B.hp > 0) {
    B.ph += dt * 5; B.hitT = Math.max(0, B.hitT - dt);
    const dx = G.lx - B.x, dy = SQY - B.y, d = Math.hypot(dx, dy);
    if (d > B.r + R * .6) { B.x += dx / d * B.spd * .6 * dt; B.y += dy / d * B.spd * dt; }
    else if (playing) { B.atkT -= dt; if (B.atkT <= 0) { B.atkT = .22; G.shake = 6; const m = G.members[G.members.length - 1]; if (m) killMember(m.x, m.y); } }
  }

  // grade de inimigos
  grid.clear();
  for (const e of G.enemies) if (!e.dead) {
    const k = gkey((e.x / CELL) | 0, ((e.y + 100) / CELL) | 0);
    let a = grid.get(k); if (!a) grid.set(k, a = []); a.push(e);
  }

  // balas
  for (const b of G.bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y < -20 || b.x < TL - 10 || b.x > TR + 10) { b.dead = true; continue; }
    // portões ficam mais fortes quando a bala passa por eles
    for (const g of G.gates) {
      if (g.used || g.op === 'x' || b.gate === g || b.x < g.x1 || b.x > g.x2 || Math.abs(b.y - g.y) > 13) continue;
      g.prog += 1; g.flash = Math.max(g.flash, .05); b.gate = g;
      if (g.prog >= G.D.gateNeed + g.ups * 6) {
        g.prog = 0; g.ups++;
        if (g.op === '-') { g.v--; if (g.v <= 0) { g.op = '+'; g.v = 1; } }
        else g.v++;
        g.flash = .15;
      }
      break;
    }
    if (B && B.hp > 0 && Math.hypot(b.x - B.x, b.y - B.y) < B.r) {
      B.hp -= b.dmg; B.hitT = .06; b.dead = true;
      if (b.w.splash) { explode(b); }
      if (B.hp <= 0) { G.money += G.D.coin * 25; puff(B.x, B.y, '#ffffff', 60); G.shake = 14; finish(true); }
      continue;
    }
    const cx = (b.x / CELL) | 0, cy = ((b.y + 100) / CELL) | 0;
    let hit = null;
    for (let yy = cy - 1; yy <= cy + 1 && !hit; yy++) for (let xx = cx - 1; xx <= cx + 1 && !hit; xx++) {
      const a = grid.get(gkey(xx, yy)); if (!a) continue;
      for (const e of a) { if (e.dead || e.id === b.last) continue; const dx = e.x - b.x, dy = e.y - b.y; if (dx * dx + dy * dy < 64) { hit = e; break; } }
    }
    if (hit) {
      if (b.w.splash) { explode(b); b.dead = true; }
      else { damageEnemy(hit, b.dmg); b.last = hit.id; if (b.pierce-- <= 0) b.dead = true; }
    }
  }
  G.bullets = G.bullets.filter(b => !b.dead);
  G.enemies = G.enemies.filter(e => !e.dead);

  for (const p of G.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .9; p.vy *= .9; p.life -= dt; }
  G.parts = G.parts.filter(p => p.life > 0);
  for (const p of G.pops) { p.y -= 34 * dt; p.life -= dt; }
  G.pops = G.pops.filter(p => p.life > 0);
  for (const c of G.coins) { c.t += dt * 1.6; }
  G.coins = G.coins.filter(c => c.t < 1);

  if (state === 'ending') { G.endT -= dt; if (G.endT <= 0) showEnd(); }
}

function explode(b) {
  const r = b.w.splash;
  for (let i = 0; i < 14; i++) G.parts.length < 500 && G.parts.push({ x: b.x, y: b.y, vx: rand(-1, 1) * 120, vy: rand(-1, 1) * 120, life: .35, max: .35, color: Math.random() < .5 ? '#ff9a3c' : '#ffe27a', r: rand(2, 4) });
  for (const e of G.enemies) if (!e.dead) { const dx = e.x - b.x, dy = e.y - b.y; if (dx * dx + dy * dy < r * r) damageEnemy(e, b.dmg); }
  G.shake = Math.max(G.shake, 2.5);
}

function finish(won) {
  if (state !== 'play') return;
  state = 'ending'; G.won = won; G.endT = 1.5;
  if (won) {
    G.enemies.forEach(e => { e.dead = true; puff(e.x, e.y, '#ffffff', 3); });
    G.money += 40 * G.p;
  }
}

// ---------- render ----------
function render() {
  const k = scale * dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const off = G ? (G.dist % PERIOD) : (performance.now() / 1000 * 20) % PERIOD;
  ctx.drawImage(bg, 0, Math.round((off - PERIOD) * k));
  const sh = G ? G.shake : 0;
  ctx.setTransform(k, 0, 0, k, (Math.random() - .5) * sh * k, (Math.random() - .5) * sh * k);
  if (!G) return;

  for (const g of G.gates) drawGate(g);

  const fr = (G.t * 8 | 0) % 2;
  for (const e of G.enemies) ctx.drawImage(SPR[(e.hitT > 0 ? 'h' : 'e') + ((e.ph | 0) % 2)], e.x - 10, e.y - 10, 20, 20);

  const B = G.boss;
  if (B && B.hp > 0) {
    ctx.drawImage(SPR['B' + ((B.ph | 0) % 2)], B.x - 40, B.y - 40, 80, 80);
    if (B.hitT > 0) { ctx.fillStyle = 'rgba(255,80,80,.35)'; ctx.beginPath(); ctx.arc(B.x, B.y, B.r, 0, 7); ctx.fill(); }
    const bw = 70; ctx.fillStyle = 'rgba(0,0,0,.6)'; rr(B.x - bw / 2 - 2, B.y - 52, bw + 4, 10, 5); ctx.fill();
    ctx.fillStyle = '#ff4757'; rr(B.x - bw / 2, B.y - 50, Math.max(6, bw * B.hp / B.max), 6, 3); ctx.fill();
  }

  // balas
  for (const b of G.bullets) {
    const w = b.w;
    if (w.kind === 'rocket') {
      ctx.fillStyle = 'rgba(255,200,120,.35)'; ctx.beginPath(); ctx.arc(b.x, b.y + 8, 3.5, 0, 7); ctx.fill();
      ctx.fillStyle = w.col; ctx.beginPath(); ctx.arc(b.x, b.y, 3.4, 0, 7); ctx.fill();
    } else {
      const L = w.kind === 'laser' ? 22 : 9, n = Math.hypot(b.vx, b.vy);
      ctx.strokeStyle = w.col; ctx.lineWidth = w.kind === 'laser' ? 2.6 : 2.2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx / n * L, b.y - b.vy / n * L); ctx.stroke();
    }
  }

  // esquadrão (líder por último, por cima)
  for (let i = G.members.length - 1; i >= 1; i--) { const m = G.members[i]; ctx.drawImage(SPR['b' + ((fr + i) % 2)], m.x - 10, m.y - 10, 20, 20); }
  if (G.members[0]) { const m = G.members[0]; ctx.drawImage(SPR['L' + fr], m.x - 15, m.y - 17, 30, 30); }

  for (const p of G.parts) { ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  for (const c of G.coins) {
    const t = c.t * c.t, x = c.x + (W - 70 - c.x) * t, y = c.y + (22 - c.y) * t;
    ctx.fillStyle = '#ffc93c'; ctx.strokeStyle = '#a06e00'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, 4, 0, 7); ctx.fill(); ctx.stroke();
  }

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of G.pops) { ctx.globalAlpha = clamp(p.life / .9, 0, 1); txt(p.text, p.x, p.y, p.size, p.color); }
  ctx.globalAlpha = 1;

  drawHUD();
}

function txt(t, x, y, size, color) {
  ctx.font = `900 ${size}px "Segoe UI",system-ui,Arial,sans-serif`;
  ctx.lineJoin = 'round'; ctx.lineWidth = size / 4.5; ctx.strokeStyle = 'rgba(15,10,35,.92)';
  ctx.strokeText(t, x, y); ctx.fillStyle = color; ctx.fillText(t, x, y);
}
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawGate(g) {
  const neg = g.op === '-', h = 30, x = g.x1, w = g.x2 - g.x1, y = g.y;
  ctx.globalAlpha = clamp(g.fade, 0, 1);
  const grd = ctx.createLinearGradient(0, y - h / 2, 0, y + h / 2);
  if (neg) { grd.addColorStop(0, 'rgba(255,95,95,.9)'); grd.addColorStop(1, 'rgba(185,20,40,.9)'); }
  else { grd.addColorStop(0, 'rgba(110,180,255,.9)'); grd.addColorStop(1, 'rgba(30,95,220,.9)'); }
  ctx.fillStyle = 'rgba(0,0,0,.2)'; rr(x + 2, y - h / 2 + 5, w, h, 6); ctx.fill();
  ctx.fillStyle = grd; rr(x, y - h / 2, w, h, 6); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fillRect(x + 5, y - h / 2 + 3, w - 10, 3);
  if (g.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(.8, g.flash * 4)})`; rr(x, y - h / 2, w, h, 6); ctx.fill(); }
  ctx.fillStyle = neg ? '#7a0c18' : '#0d3a8c';
  ctx.fillRect(x - 2, y - h / 2 - 5, 5, h + 10); ctx.fillRect(x + w - 3, y - h / 2 - 5, 5, h + 10);
  // progresso do tiro
  if (!g.used && g.op !== 'x') {
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(x + 8, y + h / 2 - 6, w - 16, 3);
    ctx.fillStyle = '#fff'; ctx.fillRect(x + 8, y + h / 2 - 6, (w - 16) * g.prog / (G.D.gateNeed + g.ups * 6), 3);
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  txt(neg ? '−' + g.v : (g.op === 'x' ? 'X' : '+') + g.v, x + w / 2, y - 1, 22, '#fff');
  ctx.globalAlpha = 1;
}

function drawHUD() {
  // topo
  ctx.fillStyle = 'rgba(6,14,28,.72)'; rr(8, 8, W - 16, 30, 12); ctx.fill();
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  txt(`Fase ${G.p}`, 18, 23, 15, '#fff');
  const px = 92, pw = 170, prog = clamp(G.dist / G.D.len, 0, 1);
  ctx.fillStyle = 'rgba(255,255,255,.15)'; rr(px, 18, pw, 10, 5); ctx.fill();
  ctx.fillStyle = G.boss ? '#ff4757' : '#5fe08f'; rr(px, 18, Math.max(10, pw * prog), 10, 5); ctx.fill();
  ctx.textAlign = 'center'; txt('☠', px + pw + 10, 23, 13, G.boss ? '#ff6b6b' : '#fff');
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffc93c'; ctx.beginPath(); ctx.arc(W - 70, 23, 6, 0, 7); ctx.fill();
  txt(fmt(save.money + G.money), W - 18, 23, 15, '#ffc93c');
  // contador do esquadrão
  if (G.members[0]) {
    const R = squadR(); ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(30,95,220,.95)'; rr(G.lx - 22, SQY + R + 6, 44, 20, 10); ctx.fill();
    txt(String(G.members.length), G.lx, SQY + R + 16, 14, '#fff');
  }
  ctx.textAlign = 'left'; txt('🔫 ' + weapon().name, 14, H - 18, 13, '#fff');
  if (G.hint && state === 'play') {
    ctx.textAlign = 'center'; ctx.globalAlpha = .6 + Math.sin(G.t * 5) * .4;
    txt('← Arraste para mover →', W / 2, SQY - 90, 18, '#fff'); ctx.globalAlpha = 1;
  }
}

// ---------- controles ----------
let drag = null;
const worldX = cx => { const r = cv.getBoundingClientRect(); return (cx - r.left) / r.width * W; };
cv.addEventListener('pointerdown', e => {
  if (!G) return; cv.setPointerCapture(e.pointerId);
  drag = { x: worldX(e.clientX), tx: G.tx }; G.hint = false;
});
cv.addEventListener('pointermove', e => { if (drag && G) G.tx = drag.tx + (worldX(e.clientX) - drag.x) * 1.35; });
const up = () => { drag = null; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (G) G.hint = false; });
addEventListener('keyup', e => { keys[e.code] = false; });

// ---------- loja ----------
const $ = id => document.getElementById(id);
function renderShop() {
  $('mMoney').textContent = fmt(save.money);
  $('playLbl').textContent = `Jogar · Fase ${save.phase}`;
  const box = $('shop'); box.innerHTML = '';
  WEAPONS.forEach(w => {
    const owned = save.owned.includes(w.id), eq = save.weapon === w.id;
    const el = document.createElement('div'); el.className = 'it' + (eq ? ' eq' : '') + (!owned && save.money < w.price ? ' lock' : '');
    const pw = Math.round(Math.sqrt(dps(w) / MAXDPS) * 100);
    const extra = [w.pel > 1 ? `${w.pel} balas` : '', w.pierce ? `atravessa ${w.pierce}` : '', w.splash ? 'explosiva' : ''].filter(Boolean).join(' · ');
    el.innerHTML = `<div><b>${w.name}</b><div class="bars">Poder<span class="bar"><i style="width:${pw}%"></i></span></div>${extra ? `<small>${extra}</small>` : ''}</div>`;
    const b = document.createElement('button'); b.className = 'btn';
    if (eq) { b.className = 'btn on'; b.textContent = 'Equipada'; b.disabled = false; }
    else if (owned) { b.className = 'btn eqb'; b.textContent = 'Equipar'; b.onclick = () => { save.weapon = w.id; persist(); renderShop(); }; }
    else { b.innerHTML = `<span class="coin"></span>${fmt(w.price)}`; b.disabled = save.money < w.price;
      b.onclick = () => { if (save.money >= w.price) { save.money -= w.price; save.owned.push(w.id); save.weapon = w.id; persist(); renderShop(); } }; }
    el.appendChild(b); box.appendChild(el);
  });
  const rc = recruitCost(), maxed = save.recruits >= RECRUIT.max;
  const el = document.createElement('div'); el.className = 'it';
  el.innerHTML = `<div><b>${RECRUIT.name}</b><small>Começa a fase com ${1 + save.recruits} soldado(s)</small></div>`;
  const b = document.createElement('button'); b.className = 'btn';
  b.innerHTML = maxed ? 'MÁX' : `<span class="coin"></span>${fmt(rc)}`; b.disabled = maxed || save.money < rc;
  b.onclick = () => { if (!maxed && save.money >= rc) { save.money -= rc; save.recruits++; persist(); renderShop(); } };
  el.appendChild(b); box.appendChild(el);
}
function showEnd() {
  state = 'end';
  save.money += G.money;
  if (G.won) { save.phase++; save.best = Math.max(save.best, save.phase); }
  persist();
  $('endCard').className = 'card ' + (G.won ? 'win' : 'lose');
  $('endTitle').textContent = G.won ? `Fase ${G.p} vencida!` : 'Seu exército caiu';
  $('endSub').textContent = G.won ? 'O chefão foi derrotado. A próxima fase tem mais inimigos e mais fortes.' : 'O dinheiro que você juntou fica com você. Compre uma arma melhor e tente de novo.';
  $('stKills').textContent = G.kills;
  $('stMoney').textContent = '+' + fmt(G.money);
  $('end').classList.add('show');
}
$('btnPlay').onclick = () => { $('menu').classList.remove('show'); start(); };
$('btnNext').onclick = () => { $('end').classList.remove('show'); G = null; state = 'menu'; renderShop(); $('menu').classList.add('show'); };

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (G) {
    if (keys.ArrowLeft || keys.KeyA) G.tx -= 260 * dt;
    if (keys.ArrowRight || keys.KeyD) G.tx += 260 * dt;
    if (state === 'play' || state === 'ending') update(dt);
  }
  render();
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize(); renderShop();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
