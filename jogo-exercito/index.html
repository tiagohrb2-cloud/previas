<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d2c4a">
<title>Portões da Batalha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root{color-scheme:dark;--bg:#0a1d30;--panel:rgba(14,22,40,.95);--panel2:rgba(255,255,255,.06);--txt:#fff;--mut:rgba(255,255,255,.65);
    --go:#e8394a;--go-dk:#9d1726;--gold:#ffc93c;--gold-dk:#2a1c00;--ok:#5fe08f;--bad:#ff6b6b;--blue:#4c9bff}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--txt);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0d2c4a;box-sizing:border-box;
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
  #stage{position:relative}
  #stage canvas{display:block}
  #hud{position:absolute;left:0;top:0;pointer-events:none}
  .ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;box-sizing:border-box;
    padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
    background:rgba(5,10,20,.6)}
  .ov.show{display:flex}
  .card{background:var(--panel);border:2px solid rgba(255,255,255,.08);border-radius:22px;padding:18px 16px;
    width:min(360px,100%);max-height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  h1{margin:0;font-size:27px;font-weight:900;letter-spacing:.5px;color:var(--txt)}
  h2{margin:0;font-size:30px;font-weight:900}
  .sub{color:var(--mut);font-size:13px;margin:0;line-height:1.4}
  .money{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:900;color:var(--gold);font-size:22px}
  .coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,var(--gold) 50%,#c48a00);display:inline-block;flex:none}
  .sec{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);text-align:left;margin:2px 0 -4px}
  .list{display:grid;gap:7px;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch;padding-right:2px}
  .it{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel2);border-radius:14px;padding:9px 10px;text-align:left;border:2px solid transparent}
  .it.eq{border-color:var(--blue)}
  .it.lock{opacity:.6}
  .it b{display:block;font-size:15px}
  .it small{color:var(--mut);font-size:11.5px;display:block;margin-top:2px}
  .bars{display:flex;gap:8px;margin-top:4px;font-size:10.5px;color:var(--mut)}
  .bar{display:inline-block;width:34px;height:5px;border-radius:3px;background:rgba(255,255,255,.12);vertical-align:middle;margin-left:3px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--ok)}
  .btn{border:0;border-radius:10px;padding:8px 10px;font-weight:800;font-size:13px;color:var(--gold-dk);background:var(--gold);min-width:86px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:5px;flex:none;font-family:inherit}
  .btn.eqb{background:var(--blue);color:#fff}
  .btn.on{background:transparent;color:var(--blue);border:2px solid var(--blue)}
  .btn:disabled{background:#4a4f5a;color:#9aa0aa;cursor:default}
  .btn:focus-visible,.play:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .play{width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:20px;font-weight:900;color:#fff;font-family:inherit;flex:none;
    background:var(--go);box-shadow:0 5px 0 var(--go-dk);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
  .play:active{transform:translateY(3px);box-shadow:0 2px 0 var(--go-dk)}
  .win h2{color:var(--ok)}.lose h2{color:var(--bad)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stats div{background:var(--panel2);border-radius:12px;padding:8px}
  .stats b{display:block;font-size:20px}
  .stats span{font-size:11px;color:var(--mut)}
</style>
</head>
<body>

<div id="wrap">
  <div id="stage"><canvas id="c"></canvas><canvas id="hud"></canvas></div>

  <div class="ov show" id="menu">
    <div class="card">
      <h1>PORTÕES DA BATALHA</h1>
      <p class="sub">Arraste para mover. Seu esquadrão atira sozinho.<br>Passe pelos portões azuis para ganhar soldados. Atire neles para aumentar o valor!<br>Fuja dos vermelhos.</p>
      <div class="money"><span class="coin"></span><span id="mMoney">0</span></div>
      <div class="sec">Armas</div>
      <div class="list" id="shop"></div>
      <button class="play" id="btnPlay"><span id="playLbl">Jogar · Fase 1</span><span>›</span></button>
    </div>
  </div>

  <div class="ov" id="end">
    <div class="card" id="endCard">
      <h2 id="endTitle">Vitória!</h2>
      <p class="sub" id="endSub"></p>
      <div class="stats">
        <div><b id="stKills">0</b><span>inimigos abatidos</span></div>
        <div><b id="stMoney" style="color:var(--gold)">0</b><span>dinheiro ganho</span></div>
      </div>
      <button class="play" id="btnNext"><span>Loja de armas</span><span>›</span></button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const W = 400, H = 760, TL = 40, TR = 360, MID = (TL + TR) / 2, SQY = 610;
const SCROLL = 62, MAX_SQ = 120, MAX_BUL = 480, PERIOD = 104;

const WEAPONS = [
  { id: 'pistola',  name: 'Pistola',          price: 0,     dmg: 1,   rate: 3, pel: 1, spr: .03, spd: 520, pierce: 0, splash: 0,  col: '#ffe27a', kind: 'bullet' },
  { id: 'smg',      name: 'Submetralhadora',  price: 150,   dmg: 1,   rate: 5.5, pel: 1, spr: .07, spd: 560, pierce: 0, splash: 0,  col: '#ffd34d', kind: 'bullet' },
  { id: 'escopeta', name: 'Escopeta',         price: 450,   dmg: 1.4, rate: 1.7, pel: 5, spr: .34, spd: 500, pierce: 0, splash: 0,  col: '#ffb347', kind: 'bullet' },
  { id: 'fuzil',    name: 'Fuzil de Assalto', price: 1100,  dmg: 3.2, rate: 3.8, pel: 1, spr: .02, spd: 680, pierce: 1, splash: 0,  col: '#fff1b8', kind: 'bullet' },
  { id: 'metra',    name: 'Metralhadora',     price: 2600,  dmg: 2.6, rate: 9,   pel: 1, spr: .08, spd: 640, pierce: 0, splash: 0,  col: '#ffcf33', kind: 'bullet' },
  { id: 'bazuca',   name: 'Bazuca',           price: 5500,  dmg: 9,   rate: 1.5, pel: 1, spr: .02, spd: 380, pierce: 0, splash: 36, col: '#ff7a2f', kind: 'rocket' },
  { id: 'laser',    name: 'Rifle Laser',      price: 11000, dmg: 7,   rate: 7,   pel: 1, spr: .01, spd: 900, pierce: 4, splash: 0,  col: '#5ff3ff', kind: 'laser'  },
  { id: 'minigun',  name: 'Minigun Dourada',  price: 22000, dmg: 7,   rate: 16,  pel: 1, spr: .1,  spd: 720, pierce: 1, splash: 0,  col: '#ffe066', kind: 'bullet' },
];
const RECRUIT = { name: 'Recrutas iniciais', base: 120, max: 10 };
const dps = w => w.dmg * w.rate * w.pel * (1 + w.pierce * .5) * (w.splash ? 2.2 : 1);
const MAXDPS = Math.max(...WEAPONS.map(dps));

// ---------- save ----------
const KEY = 'portoes_batalha_v2';
let save = { phase: 1, money: 0, owned: ['pistola'], weapon: 'pistola', recruits: 0, best: 1 };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.owned) save = Object.assign(save, s); } catch (e) {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} };
const recruitCost = () => Math.round(RECRUIT.base * Math.pow(1.75, save.recruits));
const weapon = () => WEAPONS.find(w => w.id === save.weapon) || WEAPONS[0];

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? (n / 1e3).toFixed(1) + 'K' : String(Math.floor(n));
function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }; }


// ---------- 3D ----------
const wrap = document.getElementById('wrap'), stage = document.getElementById('stage');
const cv = document.getElementById('c'), hud = document.getElementById('hud'), hx = hud.getContext('2d');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: 'high-performance' });
const scene = new THREE.Scene();
const SKY = 0x0d2c4a;
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 800, 1650);
const camera = new THREE.PerspectiveCamera(50, 1, 5, 3000);
scene.add(new THREE.HemisphereLight(0xe6eeff, 0x3a4658, .62));
const sun = new THREE.DirectionalLight(0xfff4e0, .5); sun.position.set(-150, 400, 250); scene.add(sun);
let VW = 1, VH = 1, PR = 1;
const camBase = new THREE.Vector3(), camLook = new THREE.Vector3();
const X = x => x - MID, Z = y => y - SQY;
const UP = new THREE.Vector3(0, 1, 0);
const lam = (c, o) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, o || {}));

// cenário
function floorTex() {
  const c = document.createElement('canvas'); c.width = 128; c.height = 166;
  const g = c.getContext('2d');
  g.fillStyle = '#aab2bf'; g.fillRect(0, 0, 128, 166);
  const r = rng(11);
  for (let i = 0; i < 260; i++) { g.fillStyle = r() < .5 ? 'rgba(255,255,255,.07)' : 'rgba(40,50,70,.07)'; g.fillRect(r() * 128, r() * 166, 3, 3); }
  g.strokeStyle = 'rgba(70,80,100,.4)'; g.lineWidth = 3;
  for (let row = 0; row < 2; row++) {
    const y = row * 83;
    g.beginPath(); g.moveTo(0, y); g.lineTo(128, y); g.stroke();
    const x0 = row ? 0 : 64; g.beginPath(); g.moveTo(x0, y); g.lineTo(x0, y + 83); g.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; return t;
}
const TRACK_W = TR - TL, TRACK_L = 2200;
const ftex = floorTex(); ftex.repeat.set(TRACK_W / 40, TRACK_L / 52);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(TRACK_W, TRACK_L), lam(0xffffff, { map: ftex }));
floor.rotation.x = -Math.PI / 2; floor.position.z = -TRACK_L / 2 + 300; scene.add(floor);
const water = new THREE.Mesh(new THREE.PlaneGeometry(5000, 5000), lam(0x0f3558));
water.rotation.x = -Math.PI / 2; water.position.y = -14; scene.add(water);
const wallMat = lam(0x5b6679), merlonMat = lam(0x7a869c);
for (const sx of [-1, 1]) {
  const wall = new THREE.Mesh(new THREE.BoxGeometry(18, 30, TRACK_L), wallMat);
  wall.position.set(sx * (TRACK_W / 2 + 9), 1, -TRACK_L / 2 + 300); scene.add(wall);
}
const MER_N = Math.ceil(TRACK_L / 26) + 2;
const merlons = new THREE.InstancedMesh(new THREE.BoxGeometry(14, 10, 13), merlonMat, MER_N * 2);
{ const m = new THREE.Matrix4(); let k = 0;
  for (const sx of [-1, 1]) for (let i = 0; i < MER_N; i++) { m.makeTranslation(sx * (TRACK_W / 2 + 9), 21, 300 - i * 26); merlons.setMatrixAt(k++, m); } }
const merGroup = new THREE.Group(); merGroup.add(merlons); scene.add(merGroup);
// faixa azul de largada
const startLine = new THREE.Mesh(new THREE.PlaneGeometry(TRACK_W, 6), new THREE.MeshBasicMaterial({ color: 0x4c9bff, transparent: true, opacity: .35 }));
startLine.rotation.x = -Math.PI / 2; startLine.position.set(0, .3, 60); scene.add(startLine);

// multidões (instanced)
const _m = new THREE.Matrix4(), _l = new THREE.Matrix4(), _q = new THREE.Quaternion(), _p = new THREE.Vector3(), _s = new THREE.Vector3();
const GEO = {
  body: new THREE.CylinderGeometry(3, 4, 8, 10).translate(0, 7.5, 0),
  head: new THREE.SphereGeometry(3.3, 12, 10).translate(0, 14.2, 0),
  leg: new THREE.BoxGeometry(2, 4.4, 2).translate(0, -2.2, 0),
  gun: new THREE.BoxGeometry(1.5, 1.5, 8).translate(3.6, 9, -3.5),
  visor: new THREE.BoxGeometry(5.4, 1.6, 1.2).translate(0, 14.6, 3),
  crown: new THREE.CylinderGeometry(3.2, 2.6, 3.2, 6).translate(0, 18.6, 0),
};
const shadowMesh = new THREE.InstancedMesh(new THREE.CircleGeometry(5.5, 14).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: .22, depthWrite: false }), 800);
shadowMesh.frustumCulled = false; scene.add(shadowMesh);
let shN = 0;
function imesh(geo, mat, n, colored) {
  const m = new THREE.InstancedMesh(geo, mat, n);
  if (colored) { m.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(n * 3).fill(1), 3); m.instanceColor.setUsage(THREE.DynamicDrawUsage); }
  m.instanceMatrix.setUsage(THREE.DynamicDrawUsage); m.frustumCulled = false; m.count = 0; scene.add(m); return m;
}
function crowd(n, c) {
  const C = { n, body: imesh(GEO.body, lam(c.tint ? 0xffffff : c.body), n, c.tint), head: imesh(GEO.head, lam(c.tint ? 0xffffff : c.head), n, c.tint),
    leg: imesh(GEO.leg, lam(c.leg), n * 2), extra: c.extra ? imesh(c.extra, lam(c.extraCol, c.extraOpt), n) : null, tint: c.tint };
  if (c.tint) { const col = new THREE.Color(c.body); for (let i = 0; i < n; i++) { C.body.setColorAt(i, col); C.head.setColorAt(i, col); } }
  return C;
}
const CR = {
  mem: crowd(MAX_SQ, { body: 0x2f7bea, head: 0xa9d0ff, leg: 0x123a80, extra: GEO.gun, extraCol: 0x1d2230 }),
  lead: crowd(1, { body: 0x1e5fd0, head: 0xffd9b0, leg: 0x0b2a66, extra: GEO.crown, extraCol: 0xffc93c, extraOpt: { emissive: 0x553300 } }),
  ene: crowd(600, { body: 0xf2f4f7, head: 0xffffff, leg: 0x7c8291, extra: GEO.visor, extraCol: 0xe0162b, extraOpt: { emissive: 0x660000 }, tint: true }),
  boss: crowd(1, { body: 0xeceef2, head: 0xffffff, leg: 0x5f6573, extra: GEO.visor, extraCol: 0xe0162b, extraOpt: { emissive: 0x880000 }, tint: true }),
};
const C_WHITE = new THREE.Color(0xf2f4f7), C_HIT = new THREE.Color(0xff7a7a);
function drawCrowd(C, list, from, sc, tintFn) {
  let k = 0;
  for (let i = from; i < list.length && k < C.n; i++, k++) {
    const e = list[i], ph = e.ph || 0, bob = Math.abs(Math.sin(ph)) * 1.3 * sc;
    _p.set(X(e.x), bob, Z(e.y)); _q.setFromAxisAngle(UP, (e.vx || 0) * .004); _s.setScalar(sc);
    _m.compose(_p, _q, _s);
    C.body.setMatrixAt(k, _m); C.head.setMatrixAt(k, _m); if (C.extra) C.extra.setMatrixAt(k, _m);
    for (let j = 0; j < 2; j++) {
      _l.makeRotationX(Math.sin(ph) * .9 * (j ? 1 : -1)); _l.setPosition(j ? 1.8 : -1.8, 4.6, 0); _l.premultiply(_m);
      C.leg.setMatrixAt(k * 2 + j, _l);
    }
    if (shN < 800) { _m.makeScale(sc, 1, sc); _m.setPosition(X(e.x), .25, Z(e.y)); shadowMesh.setMatrixAt(shN++, _m); }
    if (tintFn) { const col = tintFn(e); C.body.setColorAt(k, col); C.head.setColorAt(k, col); }
  }
  for (const m of [C.body, C.head, C.extra]) if (m) { m.count = k; m.instanceMatrix.needsUpdate = true; if (m.instanceColor) m.instanceColor.needsUpdate = true; }
  C.leg.count = k * 2; C.leg.instanceMatrix.needsUpdate = true;
}

// balas e partículas
const bulletMesh = imesh(new THREE.BoxGeometry(1.6, 1.6, 9), new THREE.MeshBasicMaterial({ color: 0xffffff }), MAX_BUL, true);
const partMesh = imesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color: 0xffffff }), 500, true);
const colCache = {};
const tcol = h => colCache[h] || (colCache[h] = new THREE.Color(h));

// portões
const gateMeshes = new Set();
function gateLabel(g, U) {
  const need = G.D.gateNeed + g.ups * 6;
  const text = g.op === '-' ? '−' + g.v : (g.op === 'x' ? 'X' : '+') + g.v;
  const prog = g.op === 'x' || g.used ? -1 : Math.round(g.prog / need * 20);
  const key = text + '|' + prog;
  if (U.key === key) return;
  U.key = key;
  const c = U.lc.getContext('2d'); c.clearRect(0, 0, 256, 96);
  c.font = '900 64px "Segoe UI",system-ui,Arial,sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.lineJoin = 'round'; c.lineWidth = 12; c.strokeStyle = 'rgba(10,15,40,.85)'; c.strokeText(text, 128, 42); c.fillStyle = '#fff'; c.fillText(text, 128, 42);
  if (prog >= 0) { c.fillStyle = 'rgba(0,0,0,.4)'; c.fillRect(48, 82, 160, 8); c.fillStyle = '#fff'; c.fillRect(48, 82, 160 * prog / 20, 8); }
  U.tex.needsUpdate = true;
  const neg = g.op === '-';
  if (U.neg !== neg) {
    U.neg = neg;
    U.panelMat.color.set(neg ? 0xff4a5a : 0x3d8bff); U.panelMat.emissive.set(neg ? 0x550010 : 0x0a2a66);
    U.postMat.color.set(neg ? 0x8a1020 : 0x1043a0);
  }
}
function makeGateMesh(g) {
  const w = g.x2 - g.x1, grp = new THREE.Group();
  const panelMat = lam(0x3d8bff, { transparent: true, opacity: .55, emissive: 0x0a2a66, depthWrite: false });
  const postMat = lam(0x1043a0, { transparent: true });
  const panel = new THREE.Mesh(new THREE.BoxGeometry(w, 30, 2.5), panelMat); panel.position.y = 17; grp.add(panel);
  for (const sx of [-w / 2, w / 2]) { const p = new THREE.Mesh(new THREE.BoxGeometry(5, 38, 5), postMat); p.position.set(sx, 19, 0); grp.add(p); }
  const top = new THREE.Mesh(new THREE.BoxGeometry(w + 6, 4, 6), postMat); top.position.y = 37; grp.add(top);
  const lc = document.createElement('canvas'); lc.width = 256; lc.height = 96;
  const tex = new THREE.CanvasTexture(lc);
  const lw = Math.min(w - 8, 120);
  const label = new THREE.Mesh(new THREE.PlaneGeometry(lw, lw * 96 / 256), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
  label.position.set(0, 19, 2); label.rotation.x = -.15; grp.add(label);
  grp.userData = { panelMat, postMat, lc, tex, label, key: '', neg: null, gate: g };
  scene.add(grp); gateMeshes.add(grp); g.mesh = grp;
  return grp;
}
function disposeGate(grp) {
  scene.remove(grp); gateMeshes.delete(grp);
  grp.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); } });
}

// boss/menu líder fixo
const MENU_LEAD = [{ x: MID, y: SQY, ph: 0 }];

function resize() {
  const cs = getComputedStyle(wrap);
  VW = Math.max(1, wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight));
  VH = Math.max(1, wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom));
  PR = Math.min(2, window.devicePixelRatio || 1);
  renderer.setPixelRatio(PR); renderer.setSize(VW, VH, false);
  cv.style.width = hud.style.width = VW + 'px'; cv.style.height = hud.style.height = VH + 'px';
  hud.width = Math.round(VW * PR); hud.height = Math.round(VH * PR);
  camera.aspect = VW / VH;
  const a = Math.min(VW / VH, .85), vf = 56;
  camera.fov = vf;
  const th = Math.tan(vf * Math.PI / 360) * a;
  const d = clamp(150 / th, 260, 640);
  const pitch = 40 * Math.PI / 180;
  camBase.set(0, Math.sin(pitch) * d, Math.cos(pitch) * d + 20);
  camLook.set(0, 0, -d * .72);
  camera.position.copy(camBase); camera.lookAt(camLook);
  camera.far = d * 4; scene.fog.near = d * 1.4; scene.fog.far = d * 3;
  camera.updateProjectionMatrix();
}

// ---------- jogo ----------
let G = null, state = 'menu';

function diff(p) {
  return {
    hp: Math.round(1 + (p - 1) * 1.5 + (p - 1) * (p - 1) * .18),
    flux: 0.9 + p * 0.95,
    espd: 58 + p * 3,
    len: 2500 + p * 160,
    bossHP: Math.round(70 * Math.pow(p, 1.65)),
    gateNeed: 8 + p * 2,
    coin: 1 + Math.floor(p / 3),
  };
}

function start() {
  const p = save.phase, D = diff(p);
  G = {
    p, D, t: 0, dist: 0, money: 0, kills: 0,
    lx: MID, tx: MID, members: [], enemies: [], bullets: [], gates: [], parts: [], pops: [], coins: [],
    boss: null, waveT: 4, gateT: .4, fireAcc: 0, shotIdx: 0, shake: 0, hint: true, endT: 0, eid: 0, bossT: 0,
  };
  for (let i = 0; i < 1 + save.recruits; i++) G.members.push({ x: MID, y: SQY, ph: Math.random() * 6 });
  state = 'play';
}

function slot(i) { if (!i) return [0, 0]; const r = 7.2 * Math.sqrt(i), a = i * 2.39996; return [Math.cos(a) * r, Math.sin(a) * r * .75]; }
function squadR() { return Math.min(7.2 * Math.sqrt(G.members.length) + 6, (TR - TL) / 2 - 6); }

function addMembers(n) {
  for (let i = 0; i < n && G.members.length < MAX_SQ; i++) G.members.push({ x: G.lx + rand(-6, 6), y: SQY + rand(-6, 6), ph: Math.random() * 6 });
}
function killMember(x, y) {
  puff(x, y, '#4c9bff', 6);
  if (G.members.length <= 1) { G.members.length = 0; finish(false); return; }
  G.members.pop();
}

function puff(x, y, color, n) {
  for (let i = 0; i < n && G.parts.length < 500; i++) {
    const a = Math.random() * 6.28, s = rand(25, 100);
    G.parts.push({ x, y, h: rand(5, 14), vh: rand(30, 110), vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(.2, .5), max: .5, color, r: rand(1.2, 2.8) });
  }
}
function pop(x, y, text, color, size) { if (G.pops.length < 40) G.pops.push({ x, y, text, color, life: .9, size: size || 16 }); }

function spawnWave() {
  const n = Math.round(rand(2, 5) + G.p * 1.1 + G.t / 12);
  const cx = rand(TL + 40, TR - 40);
  for (let i = 0; i < n; i++) {
    const hp = G.D.hp;
    G.enemies.push({ id: ++G.eid, x: clamp(cx + rand(-45, 45), TL + 6, TR - 6), y: -10 - rand(0, 70), hp, max: hp,
      spd: G.D.espd + rand(0, 22), vx: 0, ph: Math.random() * 6, hitT: 0 });
  }
  G.waveT = n / (G.D.flux * (.45 + .55 * Math.min(1, G.t / 25)));
}

function gateVal(r) {
  const p = G.p;
  if (r < (p < 3 ? .1 : .16)) return { op: 'x', v: p >= 4 && Math.random() < .3 ? 3 : 2 };
  const adds = p < 3 ? [1, 2, 2, 3] : p < 6 ? [2, 3, 4, 5] : [3, 5, 6, 8];
  return { op: '+', v: adds[(Math.random() * adds.length) | 0] };
}
function spawnGates() {
  const side = Math.random() < .5 ? 0 : 1;
  const stack = 1 + Math.floor(rand(0, Math.min(4, 2 + G.p / 3)));
  let hadX = false;
  for (let i = 0; i < stack; i++) {
    let g = gateVal(Math.random());
    if (g.op === 'x') { if (hadX) g = { op: '+', v: 2 }; hadX = true; }
    G.gates.push(mkGate(side, -30 - i * 52, g.op, g.v));
  }
  if (G.p >= 2 && Math.random() < .45) G.gates.push(mkGate(1 - side, -30 - rand(0, (stack - 1) * 52), '-', 1 + Math.floor(rand(1, 2 + G.p * .8))));
  G.gateT = rand(3.6, 5.2) + stack * .5;
}
function mkGate(side, y, op, v) {
  const x1 = side ? MID + 3 : TL + 4, x2 = side ? TR - 4 : MID - 3;
  return { x1, x2, y, op, v, prog: 0, ups: 0, used: false, flash: 0, fade: 1 };
}

function shoot(w) {
  const N = G.members.length; if (!N) return;
  const shooters = Math.min(N, 22), mult = N / shooters;
  G.fireAcc += w.rate * shooters * G.dt;
  let guard = 0;
  while (G.fireAcc >= 1 && guard++ < 80) {
    G.fireAcc -= 1;
    const m = G.members[G.shotIdx++ % shooters];
    for (let k = 0; k < w.pel; k++) {
      if (G.bullets.length >= MAX_BUL) break;
      const a = -Math.PI / 2 + (w.pel > 1 ? (k / (w.pel - 1) - .5) * w.spr : 0) + rand(-w.spr, w.spr) * (w.pel > 1 ? .25 : 1);
      G.bullets.push({ x: m.x + 3, y: m.y - 8, vx: Math.cos(a) * w.spd, vy: Math.sin(a) * w.spd,
        dmg: w.dmg * mult, pierce: w.pierce, last: 0, w });
    }
  }
}

function damageEnemy(e, dmg) {
  e.hp -= dmg; e.hitT = .08;
  if (e.hp <= 0 && !e.dead) {
    e.dead = true; G.kills++;
    G.money += G.D.coin;
    puff(e.x, e.y, '#ffffff', 5);
    if (G.coins.length < 60) G.coins.push({ x: e.x, y: e.y, t: 0 });
  }
}

const grid = new Map(), CELL = 20;
function gkey(cx, cy) { return cy * 64 + cx; }

function update(dt) {
  G.dt = dt; G.t += dt;
  G.shake = Math.max(0, G.shake - dt * 22);
  const w = weapon(), playing = state === 'play';

  if (playing && !G.boss) {
    G.dist += SCROLL * dt;
    if (G.dist >= G.D.len) {
      G.boss = { x: MID, y: -50, hp: G.D.bossHP, max: G.D.bossHP, r: 30, spd: 24 + G.p, ph: 0, atkT: 0, hitT: 0 };
      pop(MID, 200, 'CHEFÃO!', '#ff6b6b', 34); G.shake = 8;
    }
  }
  if (playing && !G.boss) {
    G.waveT -= dt; if (G.waveT <= 0) spawnWave();
    G.gateT -= dt; if (G.gateT <= 0 && G.dist < G.D.len - 500) spawnGates();
  } else if (playing && G.boss) {
    G.waveT -= dt; if (G.waveT <= 0) { spawnWave(); G.waveT *= 2.5; }
  }

  // esquadrão
  const R = squadR();
  G.tx = clamp(G.tx, TL + R, TR - R);
  G.lx += (G.tx - G.lx) * Math.min(1, dt * 16);
  G.members.forEach((m, i) => { m.ph += dt * 13; const [ox, oy] = slot(i); m.x += (G.lx + ox - m.x) * Math.min(1, dt * 12); m.y += (SQY + oy - m.y) * Math.min(1, dt * 12); });
  if (playing) shoot(w);

  // portões
  for (const g of G.gates) {
    g.y += SCROLL * dt; g.flash = Math.max(0, g.flash - dt);
    if (g.used) g.fade -= dt * 3;
    if (!g.used && g.y >= SQY - 4) {
      g.used = true;
      if (playing && G.lx >= g.x1 && G.lx <= g.x2) {
        const N = G.members.length;
        if (g.op === '+') { addMembers(g.v); pop(G.lx, SQY - 40, '+' + g.v, '#9cd0ff', 22); }
        else if (g.op === 'x') { addMembers(N * (g.v - 1)); pop(G.lx, SQY - 40, 'X' + g.v, '#9cd0ff', 26); }
        else { for (let i = 0; i < g.v && state === 'play'; i++) killMember(G.lx + rand(-R, R), SQY + rand(-10, 10)); pop(G.lx, SQY - 40, '−' + g.v, '#ff8080', 22); }
        g.flash = .2;
      }
    }
  }
  G.gates = G.gates.filter(g => g.fade > 0 && g.y < H + 40);

  // inimigos
  for (const e of G.enemies) {
    e.y += e.spd * dt; e.ph += dt * 12; e.hitT = Math.max(0, e.hitT - dt);
    if (e.y > 200) { const d = clamp((G.lx - e.x) * 1.4, -75, 75); e.vx += (d - e.vx) * dt * 3; }
    e.x = clamp(e.x + e.vx * dt, TL + 6, TR - 6);
    if (e.y > H + 20) e.dead = true;
    if (playing && !e.dead && Math.abs(e.y - SQY) < R + 14 && Math.abs(e.x - G.lx) < R + 14) {
      for (const m of G.members) {
        const dx = m.x - e.x, dy = m.y - e.y;
        if (dx * dx + dy * dy < 120) { e.dead = true; puff(e.x, e.y, '#ffffff', 4); G.shake = Math.max(G.shake, 3); killMember(m.x, m.y); break; }
      }
    }
  }

  // chefão
  const B = G.boss;
  if (B && B.hp > 0) {
    B.ph += dt * 5; B.hitT = Math.max(0, B.hitT - dt);
    const dx = G.lx - B.x, dy = SQY - B.y, d = Math.hypot(dx, dy);
    if (d > B.r + R * .6) { B.x += dx / d * B.spd * .6 * dt; B.y += dy / d * B.spd * dt; }
    else if (playing) { B.atkT -= dt; if (B.atkT <= 0) { B.atkT = .22; G.shake = 6; const m = G.members[G.members.length - 1]; if (m) killMember(m.x, m.y); } }
  }

  // grade de inimigos
  grid.clear();
  for (const e of G.enemies) if (!e.dead) {
    const k = gkey((e.x / CELL) | 0, ((e.y + 100) / CELL) | 0);
    let a = grid.get(k); if (!a) grid.set(k, a = []); a.push(e);
  }

  // balas
  for (const b of G.bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y < -20 || b.x < TL - 10 || b.x > TR + 10) { b.dead = true; continue; }
    // portões ficam mais fortes quando a bala passa por eles
    for (const g of G.gates) {
      if (g.used || g.op === 'x' || b.gate === g || b.x < g.x1 || b.x > g.x2 || Math.abs(b.y - g.y) > 13) continue;
      g.prog += 1; g.flash = Math.max(g.flash, .05); b.gate = g;
      if (g.prog >= G.D.gateNeed + g.ups * 6) {
        g.prog = 0; g.ups++;
        if (g.op === '-') { g.v--; if (g.v <= 0) { g.op = '+'; g.v = 1; } }
        else g.v++;
        g.flash = .15;
      }
      break;
    }
    if (B && B.hp > 0 && Math.hypot(b.x - B.x, b.y - B.y) < B.r) {
      B.hp -= b.dmg; B.hitT = .06; b.dead = true;
      if (b.w.splash) { explode(b); }
      if (B.hp <= 0) { G.money += G.D.coin * 25; puff(B.x, B.y, '#ffffff', 60); G.shake = 14; finish(true); }
      continue;
    }
    const cx = (b.x / CELL) | 0, cy = ((b.y + 100) / CELL) | 0;
    let hit = null;
    for (let yy = cy - 1; yy <= cy + 1 && !hit; yy++) for (let xx = cx - 1; xx <= cx + 1 && !hit; xx++) {
      const a = grid.get(gkey(xx, yy)); if (!a) continue;
      for (const e of a) { if (e.dead || e.id === b.last) continue; const dx = e.x - b.x, dy = e.y - b.y; if (dx * dx + dy * dy < 64) { hit = e; break; } }
    }
    if (hit) {
      if (b.w.splash) { explode(b); b.dead = true; }
      else { damageEnemy(hit, b.dmg); b.last = hit.id; if (b.pierce-- <= 0) b.dead = true; }
    }
  }
  G.bullets = G.bullets.filter(b => !b.dead);
  G.enemies = G.enemies.filter(e => !e.dead);

  for (const p of G.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vh -= 260 * dt; p.h = Math.max(.5, p.h + p.vh * dt); p.vx *= .9; p.vy *= .9; p.life -= dt; }
  G.parts = G.parts.filter(p => p.life > 0);
  for (const p of G.pops) { p.y -= 34 * dt; p.life -= dt; }
  G.pops = G.pops.filter(p => p.life > 0);
  for (const c of G.coins) { c.t += dt * 1.6; }
  G.coins = G.coins.filter(c => c.t < 1);

  if (state === 'ending') { G.endT -= dt; if (G.endT <= 0) showEnd(); }
}

function explode(b) {
  const r = b.w.splash;
  for (let i = 0; i < 14; i++) G.parts.length < 500 && G.parts.push({ x: b.x, y: b.y, h: rand(4, 16), vh: rand(40, 140), vx: rand(-1, 1) * 120, vy: rand(-1, 1) * 120, life: .35, max: .35, color: Math.random() < .5 ? '#ff9a3c' : '#ffe27a', r: rand(2, 4) });
  for (const e of G.enemies) if (!e.dead) { const dx = e.x - b.x, dy = e.y - b.y; if (dx * dx + dy * dy < r * r) damageEnemy(e, b.dmg); }
  G.shake = Math.max(G.shake, 2.5);
}

function finish(won) {
  if (state !== 'play') return;
  state = 'ending'; G.won = won; G.endT = 1.5;
  if (won) {
    G.enemies.forEach(e => { e.dead = true; puff(e.x, e.y, '#ffffff', 3); });
    G.money += 40 * G.p;
  }
}

// ---------- render ----------
const _v = new THREE.Vector3();
function proj(x, h, y) { _v.set(X(x), h, Z(y)).project(camera); return [(_v.x + 1) / 2 * VW, (1 - _v.y) / 2 * VH]; }

function render() {
  const dist = G ? G.dist : performance.now() / 1000 * 30;
  ftex.offset.y = (dist / 52) % 1;
  merGroup.position.z = dist % 26;
  startLine.position.z = 60 + (G ? G.dist : 0);
  startLine.visible = startLine.position.z < 400;

  const sh = G ? G.shake : 0;
  const follow = G ? X(G.lx) * .45 : 0;
  camera.position.set(camBase.x + follow + (Math.random() - .5) * sh * 1.5, camBase.y + (Math.random() - .5) * sh * 1.5, camBase.z);
  camera.lookAt(camLook.x + follow, camLook.y, camLook.z);

  shN = 0;
  if (!G) {
    MENU_LEAD[0].ph = performance.now() / 80;
    drawCrowd(CR.lead, MENU_LEAD, 0, 1.5);
    for (const C of [CR.mem, CR.ene, CR.boss]) drawCrowd(C, [], 0, 1);
    bulletMesh.count = 0; partMesh.count = 0;
    for (const grp of [...gateMeshes]) disposeGate(grp);
  } else {
    drawCrowd(CR.lead, G.members, 0, 1.5);
    drawCrowd(CR.mem, G.members.length > 1 ? G.members : [], 1, 1);
    drawCrowd(CR.ene, G.enemies, 0, 1.2, e => e.hitT > 0 ? C_HIT : C_WHITE);
    const B = G.boss;
    drawCrowd(CR.boss, B && B.hp > 0 ? [B] : [], 0, 4.6, e => e.hitT > 0 ? C_HIT : C_WHITE);

    // portões
    const live = new Set(G.gates);
    for (const grp of [...gateMeshes]) if (!live.has(grp.userData.gate)) disposeGate(grp);
    for (const g of G.gates) {
      const grp = g.mesh || makeGateMesh(g), U = grp.userData;
      grp.position.set(X((g.x1 + g.x2) / 2), 0, Z(g.y));
      gateLabel(g, U);
      const f = clamp(g.fade, 0, 1);
      U.panelMat.opacity = .55 * f; U.postMat.opacity = f; U.label.material.opacity = f;
      U.panelMat.emissiveIntensity = 1 + g.flash * 12;
      grp.scale.y = g.used ? Math.max(.01, f) : 1;
    }

    // balas
    let k = 0;
    for (const b of G.bullets) {
      if (k >= MAX_BUL) break;
      const w = b.w;
      _p.set(X(b.x), 9, Z(b.y)); _q.setFromAxisAngle(UP, Math.atan2(b.vx, b.vy));
      if (w.kind === 'rocket') _s.set(2.6, 2.6, .8); else if (w.kind === 'laser') _s.set(1, 1, 2.8); else _s.set(1, 1, 1);
      _m.compose(_p, _q, _s); bulletMesh.setMatrixAt(k, _m); bulletMesh.setColorAt(k, tcol(w.col)); k++;
    }
    bulletMesh.count = k; bulletMesh.instanceMatrix.needsUpdate = true; if (bulletMesh.instanceColor) bulletMesh.instanceColor.needsUpdate = true;

    // partículas
    k = 0;
    for (const p of G.parts) {
      if (k >= 500) break;
      const s = p.r * 1.4 * clamp(p.life / p.max + .3, 0, 1);
      _p.set(X(p.x), p.h, Z(p.y)); _q.identity(); _s.setScalar(s);
      _m.compose(_p, _q, _s); partMesh.setMatrixAt(k, _m); partMesh.setColorAt(k, tcol(p.color)); k++;
    }
    partMesh.count = k; partMesh.instanceMatrix.needsUpdate = true; if (partMesh.instanceColor) partMesh.instanceColor.needsUpdate = true;
  }
  shadowMesh.count = shN; shadowMesh.instanceMatrix.needsUpdate = true;

  renderer.render(scene, camera);
  drawHUD();
}

function txt(t, x, y, size, color) {
  hx.font = `900 ${size}px "Segoe UI",system-ui,Arial,sans-serif`;
  hx.lineJoin = 'round'; hx.lineWidth = size / 4.5; hx.strokeStyle = 'rgba(15,10,35,.92)';
  hx.strokeText(t, x, y); hx.fillStyle = color; hx.fillText(t, x, y);
}
function rr(x, y, w, h, r) {
  hx.beginPath(); hx.moveTo(x + r, y); hx.arcTo(x + w, y, x + w, y + h, r); hx.arcTo(x + w, y + h, x, y + h, r);
  hx.arcTo(x, y + h, x, y, r); hx.arcTo(x, y, x + w, y, r); hx.closePath();
}

function drawHUD() {
  hx.setTransform(PR, 0, 0, PR, 0, 0);
  hx.clearRect(0, 0, VW, VH);
  if (!G) return;
  hx.textBaseline = 'middle';
  // barra de cima
  hx.fillStyle = 'rgba(6,14,28,.72)'; rr(8, 8, VW - 16, 32, 12); hx.fill();
  hx.textAlign = 'left'; txt(`Fase ${G.p}`, 18, 24, 15, '#fff');
  const money = fmt(save.money + G.money);
  hx.font = '900 15px "Segoe UI",system-ui,Arial,sans-serif';
  const mw = hx.measureText(money).width, coinX = VW - 26 - mw;
  const px = 88, pw = Math.max(40, coinX - 30 - px);
  const prog = clamp(G.dist / G.D.len, 0, 1);
  hx.fillStyle = 'rgba(255,255,255,.15)'; rr(px, 19, pw, 10, 5); hx.fill();
  hx.fillStyle = G.boss ? '#ff4757' : '#5fe08f'; rr(px, 19, Math.max(10, pw * prog), 10, 5); hx.fill();
  hx.textAlign = 'center'; txt('☠', px + pw + 11, 24, 13, G.boss ? '#ff6b6b' : '#fff');
  hx.fillStyle = '#ffc93c'; hx.beginPath(); hx.arc(coinX, 24, 6, 0, 7); hx.fill();
  hx.textAlign = 'right'; txt(money, VW - 16, 24, 15, '#ffc93c');

  // vida do chefão
  const B = G.boss;
  if (B && B.hp > 0) {
    const [bx, by] = proj(B.x, 95, B.y), bw = 90;
    hx.fillStyle = 'rgba(0,0,0,.6)'; rr(bx - bw / 2 - 2, by - 6, bw + 4, 12, 6); hx.fill();
    hx.fillStyle = '#ff4757'; rr(bx - bw / 2, by - 4, Math.max(6, bw * B.hp / B.max), 8, 4); hx.fill();
  }
  // contador do esquadrão
  if (G.members[0]) {
    const R = squadR(); const [sx, sy] = proj(G.lx, 0, SQY + R + 14);
    hx.fillStyle = 'rgba(30,95,220,.95)'; rr(sx - 24, sy - 11, 48, 22, 11); hx.fill();
    hx.textAlign = 'center'; txt(String(G.members.length), sx, sy, 15, '#fff');
  }
  // moedas voando
  for (const c of G.coins) {
    const [x0, y0] = proj(c.x, 10, c.y), t = c.t * c.t;
    const x = x0 + (coinX - x0) * t, y = y0 + (24 - y0) * t;
    hx.fillStyle = '#ffc93c'; hx.strokeStyle = '#a06e00'; hx.lineWidth = 1; hx.beginPath(); hx.arc(x, y, 5, 0, 7); hx.fill(); hx.stroke();
  }
  // textos flutuantes
  hx.textAlign = 'center';
  for (const p of G.pops) {
    const [x, y] = proj(p.x, 30 + (.9 - p.life) * 40, p.y);
    hx.globalAlpha = clamp(p.life / .9, 0, 1); txt(p.text, x, y, p.size * 1.1, p.color);
  }
  hx.globalAlpha = 1;
  hx.textAlign = 'left'; txt('🔫 ' + weapon().name, 14, VH - 20, 14, '#fff');
  if (G.hint && state === 'play') {
    hx.textAlign = 'center'; hx.globalAlpha = .6 + Math.sin(G.t * 5) * .4;
    txt('← Arraste para mover →', VW / 2, VH * .55, 19, '#fff'); hx.globalAlpha = 1;
  }
}

const $ = id => document.getElementById(id);
function renderShop() {
  $('mMoney').textContent = fmt(save.money);
  $('playLbl').textContent = `Jogar · Fase ${save.phase}`;
  const box = $('shop'); box.innerHTML = '';
  WEAPONS.forEach(w => {
    const owned = save.owned.includes(w.id), eq = save.weapon === w.id;
    const el = document.createElement('div'); el.className = 'it' + (eq ? ' eq' : '') + (!owned && save.money < w.price ? ' lock' : '');
    const pw = Math.round(Math.sqrt(dps(w) / MAXDPS) * 100);
    const extra = [w.pel > 1 ? `${w.pel} balas` : '', w.pierce ? `atravessa ${w.pierce}` : '', w.splash ? 'explosiva' : ''].filter(Boolean).join(' · ');
    el.innerHTML = `<div><b>${w.name}</b><div class="bars">Poder<span class="bar"><i style="width:${pw}%"></i></span></div>${extra ? `<small>${extra}</small>` : ''}</div>`;
    const b = document.createElement('button'); b.className = 'btn';
    if (eq) { b.className = 'btn on'; b.textContent = 'Equipada'; b.disabled = false; }
    else if (owned) { b.className = 'btn eqb'; b.textContent = 'Equipar'; b.onclick = () => { save.weapon = w.id; persist(); renderShop(); }; }
    else { b.innerHTML = `<span class="coin"></span>${fmt(w.price)}`; b.disabled = save.money < w.price;
      b.onclick = () => { if (save.money >= w.price) { save.money -= w.price; save.owned.push(w.id); save.weapon = w.id; persist(); renderShop(); } }; }
    el.appendChild(b); box.appendChild(el);
  });
  const rc = recruitCost(), maxed = save.recruits >= RECRUIT.max;
  const el = document.createElement('div'); el.className = 'it';
  el.innerHTML = `<div><b>${RECRUIT.name}</b><small>Começa a fase com ${1 + save.recruits} soldado(s)</small></div>`;
  const b = document.createElement('button'); b.className = 'btn';
  b.innerHTML = maxed ? 'MÁX' : `<span class="coin"></span>${fmt(rc)}`; b.disabled = maxed || save.money < rc;
  b.onclick = () => { if (!maxed && save.money >= rc) { save.money -= rc; save.recruits++; persist(); renderShop(); } };
  el.appendChild(b); box.appendChild(el);
}
function showEnd() {
  state = 'end';
  save.money += G.money;
  if (G.won) { save.phase++; save.best = Math.max(save.best, save.phase); }
  persist();
  $('endCard').className = 'card ' + (G.won ? 'win' : 'lose');
  $('endTitle').textContent = G.won ? `Fase ${G.p} vencida!` : 'Seu exército caiu';
  $('endSub').textContent = G.won ? 'O chefão foi derrotado. A próxima fase tem mais inimigos e mais fortes.' : 'O dinheiro que você juntou fica com você. Compre uma arma melhor e tente de novo.';
  $('stKills').textContent = G.kills;
  $('stMoney').textContent = '+' + fmt(G.money);
  $('end').classList.add('show');
}
$('btnPlay').onclick = () => { $('menu').classList.remove('show'); start(); };
$('btnNext').onclick = () => { $('end').classList.remove('show'); G = null; state = 'menu'; renderShop(); $('menu').classList.add('show'); };

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (G) {
    if (keys.ArrowLeft || keys.KeyA) G.tx -= 260 * dt;
    if (keys.ArrowRight || keys.KeyD) G.tx += 260 * dt;
    if (state === 'play' || state === 'ending') update(dt);
  }
  render();
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize(); renderShop();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
