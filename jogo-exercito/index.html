<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1d30">
<title>Portões da Batalha</title>
<style>
  :root{--bg:#0a1d30;--panel:rgba(14,22,40,.92);--txt:#fff;--accent:#8b3dff;--go:#e8394a;--gold:#ffc93c}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--txt);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block}
  .ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:16px;
    background:rgba(5,10,20,.55);backdrop-filter:blur(2px)}
  .ov.show{display:flex}
  .card{background:var(--panel);border:2px solid rgba(255,255,255,.08);border-radius:22px;padding:22px 20px;
    width:min(340px,100%);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  h1{margin:0 0 4px;font-size:30px;font-weight:900;letter-spacing:.5px;
    background:linear-gradient(#fff,#b9a2ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  h2{margin:0 0 6px;font-size:32px;font-weight:900}
  .sub{opacity:.75;font-size:14px;margin:0 0 16px}
  .coins{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--gold);font-size:18px;margin-bottom:14px}
  .coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#ffc93c 50%,#c48a00);display:inline-block}
  .ups{display:grid;gap:8px;margin-bottom:16px}
  .up{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.06);
    border-radius:14px;padding:10px 12px;text-align:left}
  .up b{display:block;font-size:15px}
  .up small{opacity:.7;font-size:12px}
  .up button{border:0;border-radius:10px;padding:8px 10px;font-weight:800;font-size:14px;color:#2a1c00;
    background:var(--gold);min-width:74px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
  .up button:disabled{background:#555;color:#999;cursor:default}
  .play{width:100%;border:0;border-radius:14px;padding:15px;font-size:20px;font-weight:900;color:#fff;
    background:var(--go);box-shadow:0 5px 0 #9d1726;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
  .play:active{transform:translateY(3px);box-shadow:0 2px 0 #9d1726}
  .win h2{color:#6dff9b}.lose h2{color:#ff6b6b}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <div class="ov show" id="menu">
    <div class="card">
      <h1>PORTÕES DA BATALHA</h1>
      <p class="sub">Segure e arraste para disparar soldados.<br>Passe pelos portões para multiplicar o exército!</p>
      <div class="coins"><span class="coin"></span><span id="mCoins">0</span></div>
      <div class="ups" id="ups"></div>
      <button class="play" id="btnPlay"><span id="playLbl">Jogar · Fase 1</span><span>›</span></button>
    </div>
  </div>

  <div class="ov" id="end">
    <div class="card" id="endCard">
      <h2 id="endTitle">Vitória!</h2>
      <p class="sub" id="endSub"></p>
      <div class="coins"><span class="coin"></span><span id="endCoins">+0</span></div>
      <button class="play" id="btnNext"><span id="nextLbl">Continuar</span><span>›</span></button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
// ---------- Constantes do mundo ----------
const W = 400, H = 760;
const TL = 50, TR = 350;            // limites da pista
const CASTLE_Y = 100;               // base do castelo inimigo
const CANNON_Y = 690;               // linha do canhão
const BLUE_SPEED = 78, RED_SPEED = 42;
const MAX_BLUE = 700;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let scale = 1, dpr = 1, bg = null, sprBlue = null, sprRed = null;

// ---------- Save ----------
const SAVE_KEY = 'portoes_batalha_v1';
let save = { level: 1, coins: 0, up: { rate: 0, multi: 0, wall: 0 } };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.up) save = s; } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

const UPGRADES = [
  { id: 'rate',  name: 'Cadência',     desc: l => `Tiro a cada ${(fireInterval(l)*1000|0)}ms`, max: 12, base: 40 },
  { id: 'multi', name: 'Canhão duplo', desc: l => `${1+l} soldado(s) por tiro`, max: 5, base: 90 },
  { id: 'wall',  name: 'Muralha',      desc: l => `${livesFor(l)} vidas`, max: 8, base: 50 },
];
function fireInterval(l) { return Math.max(0.05, 0.22 * Math.pow(0.88, l)); }
function livesFor(l) { return 10 + 5 * l; }
function upCost(u) { return Math.round(u.base * Math.pow(1.6, save.up[u.id])); }

// ---------- Util ----------
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }; }

// ---------- Resize / pré-render ----------
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  scale = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * scale + 'px';
  cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
  buildBg();
  sprBlue = makeSprite('#2f7bea', '#123a80', '#a9d0ff');
  sprRed  = makeSprite('#e23a3a', '#761111', '#ffc2b0');
}

function makeSprite(body, dark, head) {
  const k = scale * dpr, s = document.createElement('canvas');
  s.width = s.height = Math.ceil(16 * k);
  const c = s.getContext('2d'); c.scale(k, k);
  c.fillStyle = 'rgba(0,0,0,.28)'; c.beginPath(); c.ellipse(8, 11.5, 5.2, 2.4, 0, 0, 7); c.fill();
  c.fillStyle = body; c.strokeStyle = dark; c.lineWidth = 1.1;
  c.beginPath(); c.arc(8, 8.5, 4.4, 0, 7); c.fill(); c.stroke();
  c.fillStyle = head; c.beginPath(); c.arc(8, 6.2, 2.7, 0, 7); c.fill(); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.arc(7, 5.3, 1, 0, 7); c.fill();
  return s;
}

function buildBg() {
  bg = document.createElement('canvas'); bg.width = cv.width; bg.height = cv.height;
  const c = bg.getContext('2d'); c.scale(scale * dpr, scale * dpr);
  // água
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0c2740'); g.addColorStop(1, '#071626');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  const r = rng(7); c.strokeStyle = 'rgba(120,180,230,.12)'; c.lineWidth = 1.2;
  for (let i = 0; i < 70; i++) { const x = r() * W, y = r() * H, w = 6 + r() * 16;
    c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + w / 2, y - 3, x + w, y); c.stroke(); }
  // muralhas laterais
  c.fillStyle = '#3e4756'; c.fillRect(TL - 16, 0, TR - TL + 32, H);
  c.fillStyle = '#566174'; c.fillRect(TL - 16, 0, 10, H); c.fillRect(TR + 6, 0, 10, H);
  for (let y = 4; y < H; y += 22) {
    c.fillStyle = '#6f7b90'; c.fillRect(TL - 18, y, 12, 12); c.fillRect(TR + 6, y, 12, 12);
    c.fillStyle = '#2c333f'; c.fillRect(TL - 18, y + 12, 12, 3); c.fillRect(TR + 6, y + 12, 12, 3);
  }
  // piso
  c.fillStyle = '#b8bfca'; c.fillRect(TL, 0, TR - TL, H);
  c.strokeStyle = 'rgba(80,90,110,.18)'; c.lineWidth = 1;
  for (let y = 0; y < H; y += 26) {
    c.beginPath(); c.moveTo(TL, y); c.lineTo(TR, y); c.stroke();
    const off = (y / 26) % 2 ? 0 : 25;
    for (let x = TL + off; x < TR; x += 50) { c.beginPath(); c.moveTo(x, y); c.lineTo(x, y + 26); c.stroke(); }
  }
  // sombra interna
  const sl = c.createLinearGradient(TL, 0, TL + 14, 0); sl.addColorStop(0, 'rgba(0,0,0,.25)'); sl.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = sl; c.fillRect(TL, 0, 14, H);
  const sr = c.createLinearGradient(TR, 0, TR - 14, 0); sr.addColorStop(0, 'rgba(0,0,0,.25)'); sr.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = sr; c.fillRect(TR - 14, 0, 14, H);
  // plataforma do canhão
  c.fillStyle = '#d6dbe3'; c.fillRect(TL, CANNON_Y - 22, TR - TL, H - CANNON_Y + 22);
  c.fillStyle = 'rgba(47,123,234,.25)'; c.fillRect(TL, CANNON_Y - 24, TR - TL, 4);
}

// ---------- Estado do jogo ----------
let G = null;
let state = 'menu';

function makeLevel(n) {
  const r = rng(n * 977 + 13);
  const nRows = Math.min(5, 2 + Math.ceil(n / 2));
  const yTop = CASTLE_Y + 170, yBot = CANNON_Y - 120;
  const rows = [];
  const goods = n < 3 ? ['+3', '+5', 'x2', '+5', '+10'] : ['+10', 'x2', '+15', 'x3', '+20', 'x2'];
  const pick = () => goods[(r() * goods.length) | 0];
  for (let i = 0; i < nRows; i++) {
    const y = nRows === 1 ? yBot : yBot - (yBot - yTop) * i / (nRows - 1);
    const t = r();
    const gates = [];
    const mid = (TL + TR) / 2;
    if (i > 0 && t < 0.3) {
      // portão móvel forte
      gates.push(gate(mid - 55, mid + 55, n < 3 ? '+10' : (r() < 0.5 ? 'x3' : '+25'), { amp: (TR - TL - 120) / 2, spd: 1 + n * 0.08, ph: r() * 6 }));
    } else if (t < 0.65 || n < 2) {
      let a = pick(), b = pick();
      if (n >= 2 && r() < 0.35) b = '-' + (6 + n * 4);
      if (r() < 0.5) [a, b] = [b, a];
      gates.push(gate(TL + 4, mid - 3, a), gate(mid + 3, TR - 4, b));
    } else {
      const w = (TR - TL - 16) / 3;
      const vals = [pick(), pick(), n >= 3 ? '-' + (8 + n * 4) : pick()].sort(() => r() - 0.5);
      for (let k = 0; k < 3; k++) gates.push(gate(TL + 4 + k * (w + 4), TL + 4 + k * (w + 4) + w, vals[k]));
    }
    rows.push({ y, gates });
  }
  return {
    rows,
    castleHP: 1500 + 700 * (n - 1) + 60 * (n - 1) * (n - 1),
    waveEvery: Math.max(0.8, 1.6 - n * 0.06),
    waveBase: 18 + 6 * n,
    boulders: n >= 3,
  };
}

function gate(x1, x2, label, move) {
  const op = label[0], val = parseInt(label.slice(1), 10);
  return { bx1: x1, bx2: x2, x1, x2, op, val, hp: op === '-' ? val : 0, move: move || null, flash: 0, gone: false, popT: 0 };
}

function startLevel() {
  const L = makeLevel(save.level);
  G = {
    t: 0, L, rows: L.rows,
    castleHP: L.castleHP, castleMax: L.castleHP, castleShake: 0,
    lives: livesFor(save.up.wall), livesMax: livesFor(save.up.wall),
    blues: [], reds: [], boulders: [], parts: [], pops: [],
    cx: (TL + TR) / 2, aimX: (TL + TR) / 2, firing: false, fireT: 0, recoil: 0,
    waveT: 2.2, boulderT: 8, shake: 0, kills: 0, earned: 0, hint: true, endT: 0,
  };
  state = 'play';
}

// ---------- Entidades ----------
function spawnBlue(x, y, next) {
  if (G.blues.length >= MAX_BLUE) return false;
  G.blues.push({ x, y, vx: rand(-14, 14), next, dead: false, ph: Math.random() * 6 });
  return true;
}
function spawnRed(x, y) { G.reds.push({ x, y, vx: rand(-10, 10), dead: false, ph: Math.random() * 6 }); }

function puff(x, y, color, n) {
  for (let i = 0; i < n && G.parts.length < 500; i++) {
    const a = Math.random() * 6.28, s = rand(20, 90);
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(.25, .55), max: .55, color, r: rand(1.2, 2.6) });
  }
}
function pop(x, y, text, color) { if (G.pops.length < 40) G.pops.push({ x, y, text, color, life: .8 }); }

function shoot() {
  const m = 1 + save.up.multi;
  for (let i = 0; i < m; i++) spawnBlue(G.cx + (i - (m - 1) / 2) * 7 + rand(-2, 2), CANNON_Y - 26 - rand(0, 4), 0);
  G.recoil = 1;
}

function applyRow(b, idx, spawned) {
  const row = G.rows[idx];
  for (const g of row.gates) {
    if (g.gone || b.x < g.x1 || b.x > g.x2) continue;
    g.flash = 0.12;
    if (g.op === '-') {
      b.dead = true; g.hp--; puff(b.x, b.y, '#ff5050', 3);
      if (g.hp <= 0) { g.gone = true; puff((g.x1 + g.x2) / 2, row.y, '#ff8a8a', 30); G.shake = Math.max(G.shake, 4); }
    } else {
      const extra = g.op === '+' ? g.val : g.val - 1;
      for (let k = 0; k < extra; k++) {
        if (G.blues.length + spawned.length >= MAX_BLUE) break;
        spawned.push({ x: rand(g.x1 + 5, g.x2 - 5), y: row.y - rand(2, 18), vx: rand(-14, 14), next: idx + 1, dead: false, ph: Math.random() * 6 });
      }
      if (g.popT <= 0) { pop(b.x, row.y - 18, (g.op === '+' ? '+' : 'x') + g.val, '#e9dcff'); g.popT = .25; }
    }
    return;
  }
}

// ---------- Update ----------
const grid = [], CELL = 16, GC = Math.ceil(W / CELL), GR = Math.ceil(H / CELL);
for (let i = 0; i < GC * GR; i++) grid.push([]);

function update(dt) {
  G.t += dt;
  G.shake = Math.max(0, G.shake - dt * 20);
  G.castleShake = Math.max(0, G.castleShake - dt * 25);
  G.recoil = Math.max(0, G.recoil - dt * 8);

  // canhão
  const tx = clamp(G.aimX, TL + 18, TR - 18);
  G.cx += (tx - G.cx) * Math.min(1, dt * 16);
  G.fireT -= dt;
  if (G.firing && G.fireT <= 0 && state === 'play') { shoot(); G.fireT = fireInterval(save.up.rate); }

  // portões
  for (const row of G.rows) for (const g of row.gates) {
    g.flash = Math.max(0, g.flash - dt); g.popT -= dt;
    if (g.move) { const o = Math.sin(G.t * g.move.spd + g.move.ph) * g.move.amp; g.x1 = g.bx1 + o; g.x2 = g.bx2 + o; }
  }

  // ondas inimigas
  if (state === 'play') {
    G.waveT -= dt;
    if (G.waveT <= 0) {
      G.waveT = G.L.waveEvery * rand(.8, 1.2);
      const n = G.L.waveBase + Math.floor(G.t / 4);
      const cx = rand(TL + 40, TR - 40);
      for (let i = 0; i < n; i++) spawnRed(clamp(cx + rand(-60, 60), TL + 6, TR - 6), CASTLE_Y + 4 + rand(0, 22));
    }
    if (G.L.boulders) {
      G.boulderT -= dt;
      if (G.boulderT <= 0) {
        G.boulderT = rand(6, 10) - Math.min(3, save.level * .15);
        G.boulders.push({ x: rand(TL + 30, TR - 30), y: CASTLE_Y + 10, r: 17, hp: 14 + save.level * 2, rot: 0 });
      }
    }
  }

  // soldados azuis
  const spawned = [];
  for (const b of G.blues) {
    if (b.dead) continue;
    b.y -= BLUE_SPEED * dt; b.x += b.vx * dt; b.ph += dt * 14;
    if (b.x < TL + 5) { b.x = TL + 5; b.vx = Math.abs(b.vx); }
    if (b.x > TR - 5) { b.x = TR - 5; b.vx = -Math.abs(b.vx); }
    while (b.next < G.rows.length && b.y <= G.rows[b.next].y && !b.dead) { applyRow(b, b.next, spawned); b.next++; }
    if (!b.dead && b.y < CASTLE_Y) {
      b.dead = true;
      if (state === 'play') { G.castleHP--; G.castleShake = 3; puff(b.x, CASTLE_Y, '#ffd27a', 2); }
    }
  }
  for (const s of spawned) G.blues.push(s);

  // soldados vermelhos
  for (const r of G.reds) {
    if (r.dead) continue;
    r.y += RED_SPEED * dt; r.x += r.vx * dt; r.ph += dt * 10;
    if (r.x < TL + 5) { r.x = TL + 5; r.vx = Math.abs(r.vx); }
    if (r.x > TR - 5) { r.x = TR - 5; r.vx = -Math.abs(r.vx); }
    if (r.y > CANNON_Y - 14) {
      r.dead = true;
      if (state === 'play') { G.lives--; G.shake = 6; puff(r.x, r.y, '#ff3b3b', 10); }
    }
  }

  // combate (grade espacial)
  for (const c of grid) c.length = 0;
  for (const r of G.reds) if (!r.dead) {
    const gi = clamp((r.y / CELL) | 0, 0, GR - 1) * GC + clamp((r.x / CELL) | 0, 0, GC - 1);
    grid[gi].push(r);
  }
  for (const b of G.blues) {
    if (b.dead) continue;
    const cx = (b.x / CELL) | 0, cy = (b.y / CELL) | 0;
    let hit = null;
    for (let yy = cy - 1; yy <= cy + 1 && !hit; yy++) {
      if (yy < 0 || yy >= GR) continue;
      for (let xx = cx - 1; xx <= cx + 1 && !hit; xx++) {
        if (xx < 0 || xx >= GC) continue;
        for (const r of grid[yy * GC + xx]) {
          if (r.dead) continue;
          const dx = r.x - b.x, dy = r.y - b.y;
          if (dx * dx + dy * dy < 81) { hit = r; break; }
        }
      }
    }
    if (hit) {
      b.dead = hit.dead = true; G.kills++;
      puff((b.x + hit.x) / 2, (b.y + hit.y) / 2, Math.random() < .5 ? '#ffffff' : '#ff6b6b', 3);
    }
  }

  // pedras rolantes
  for (const s of G.boulders) {
    s.y += 55 * dt; s.rot += dt * 3;
    for (const b of G.blues) if (!b.dead) {
      const dx = b.x - s.x, dy = b.y - s.y;
      if (dx * dx + dy * dy < (s.r + 4) * (s.r + 4)) { b.dead = true; s.hp--; puff(b.x, b.y, '#9b6a3c', 2); }
    }
    for (const r of G.reds) if (!r.dead) {
      const dx = r.x - s.x, dy = r.y - s.y;
      if (dx * dx + dy * dy < (s.r + 4) * (s.r + 4)) { r.dead = true; puff(r.x, r.y, '#ff6b6b', 2); }
    }
    if (s.hp <= 0) { s.dead = true; puff(s.x, s.y, '#8a5a30', 34); G.shake = 5; pop(s.x, s.y, 'Destruída!', '#ffd27a'); }
    else if (s.y > CANNON_Y - 10) { s.dead = true; if (state === 'play') { G.lives -= 3; G.shake = 10; } puff(s.x, s.y, '#8a5a30', 30); }
  }

  G.blues = G.blues.filter(b => !b.dead);
  G.reds = G.reds.filter(r => !r.dead);
  G.boulders = G.boulders.filter(s => !s.dead);

  for (const p of G.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .92; p.vy *= .92; p.life -= dt; }
  G.parts = G.parts.filter(p => p.life > 0);
  for (const p of G.pops) { p.y -= 30 * dt; p.life -= dt; }
  G.pops = G.pops.filter(p => p.life > 0);

  // fim de fase
  if (state === 'play') {
    if (G.castleHP <= 0) { G.castleHP = 0; finish(true); }
    else if (G.lives <= 0) { G.lives = 0; finish(false); }
  } else if (state === 'ending') {
    G.endT -= dt;
    if (G.endT <= 0) showEnd();
  }
}

function finish(won) {
  state = 'ending'; G.won = won; G.endT = 1.4; G.firing = false;
  const reward = won ? 40 + save.level * 25 + Math.floor(G.kills / 4) : Math.floor(G.kills / 6);
  G.earned = reward;
  if (won) {
    G.reds.forEach(r => { r.dead = true; puff(r.x, r.y, '#ff6b6b', 3); });
    for (let i = 0; i < 6; i++) puff(rand(TL, TR), rand(20, CASTLE_Y), '#ffd27a', 20);
    G.shake = 12;
  }
}

// ---------- Render ----------
function render() {
  const k = scale * dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bg, 0, 0);
  const sx = G ? (Math.random() - .5) * G.shake : 0, sy = G ? (Math.random() - .5) * G.shake : 0;
  ctx.setTransform(k, 0, 0, k, sx * k, sy * k);
  if (!G) { drawCastle(1, 0); drawCannon((TL + TR) / 2, 0); return; }

  drawCastle(G.castleHP / G.castleMax, G.castleShake);

  // portões
  for (const row of G.rows) for (const g of row.gates) if (!g.gone) drawGate(g, row.y);

  const S = 16;
  for (const r of G.reds) ctx.drawImage(sprRed, r.x - 8, r.y - 8 + Math.sin(r.ph) * .8, S, S);
  for (const b of G.blues) ctx.drawImage(sprBlue, b.x - 8, b.y - 8 + Math.sin(b.ph) * .8, S, S);

  for (const s of G.boulders) drawBoulder(s);

  for (const p of G.parts) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  drawCannon(G.cx, G.recoil);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of G.pops) {
    ctx.globalAlpha = clamp(p.life / .8, 0, 1);
    txt(p.text, p.x, p.y, 15, p.color);
  }
  ctx.globalAlpha = 1;

  drawHUD();
}

function txt(t, x, y, size, color, stroke) {
  ctx.font = `900 ${size}px "Segoe UI",system-ui,Arial,sans-serif`;
  ctx.lineJoin = 'round'; ctx.lineWidth = size / 4.5; ctx.strokeStyle = stroke || 'rgba(20,10,40,.9)';
  ctx.strokeText(t, x, y); ctx.fillStyle = color; ctx.fillText(t, x, y);
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawGate(g, y) {
  const neg = g.op === '-';
  const x = g.x1, w = g.x2 - g.x1, h = 28;
  const grd = ctx.createLinearGradient(0, y - h / 2, 0, y + h / 2);
  if (neg) { grd.addColorStop(0, 'rgba(255,90,90,.88)'); grd.addColorStop(1, 'rgba(190,20,40,.88)'); }
  else { grd.addColorStop(0, 'rgba(176,110,255,.85)'); grd.addColorStop(1, 'rgba(110,30,220,.85)'); }
  ctx.fillStyle = 'rgba(0,0,0,.22)'; roundRect(x + 2, y - h / 2 + 5, w, h, 5); ctx.fill();
  ctx.fillStyle = grd; roundRect(x, y - h / 2, w, h, 5); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(x + 4, y - h / 2 + 3, w - 8, 3);
  if (g.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${g.flash * 3})`; roundRect(x, y - h / 2, w, h, 5); ctx.fill(); }
  // postes
  ctx.fillStyle = neg ? '#7a0c18' : '#4b1499';
  ctx.fillRect(x - 2, y - h / 2 - 4, 5, h + 8); ctx.fillRect(x + w - 3, y - h / 2 - 4, 5, h + 8);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const label = neg ? '−' + g.hp : (g.op === 'x' ? 'X' : '+') + g.val;
  txt(label, x + w / 2, y + 1, w < 90 ? 17 : 21, '#fff');
}

function drawBoulder(s) {
  ctx.save(); ctx.translate(s.x, s.y);
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(3, 8, s.r, s.r * .55, 0, 0, 7); ctx.fill();
  ctx.rotate(s.rot);
  const g = ctx.createRadialGradient(-5, -6, 2, 0, 0, s.r);
  g.addColorStop(0, '#c48a55'); g.addColorStop(1, '#6b4322');
  ctx.fillStyle = g; ctx.strokeStyle = '#3e260f'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = i / 10 * 6.283, rr = s.r * (i % 2 ? .9 : 1); ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(60,35,15,.5)';
  for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.arc(Math.cos(i * 2.1) * s.r * .5, Math.sin(i * 2.1) * s.r * .5, 2.2, 0, 7); ctx.fill(); }
  ctx.restore();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; txt(String(s.hp), s.x, s.y - s.r - 7, 11, '#ffd27a');
}

function drawCastle(hpFrac, shake) {
  const ox = (Math.random() - .5) * shake;
  ctx.save(); ctx.translate(ox, 0);
  const x0 = TL - 16, x1 = TR + 16;
  // corpo
  ctx.fillStyle = '#5c6474'; ctx.fillRect(x0, 0, x1 - x0, CASTLE_Y);
  ctx.fillStyle = '#4a5160';
  for (let y = 8; y < CASTLE_Y; y += 14) for (let x = x0 + ((y / 14) % 2 ? 0 : 12); x < x1; x += 24) ctx.fillRect(x, y, 22, 12);
  // ameias
  ctx.fillStyle = '#7a8496';
  for (let x = x0; x < x1; x += 20) ctx.fillRect(x, CASTLE_Y - 10, 12, 10);
  // portão
  ctx.fillStyle = '#1b1210'; ctx.beginPath();
  const gx = (TL + TR) / 2; ctx.moveTo(gx - 34, CASTLE_Y); ctx.lineTo(gx - 34, CASTLE_Y - 34); ctx.arc(gx, CASTLE_Y - 34, 34, Math.PI, 0); ctx.lineTo(gx + 34, CASTLE_Y); ctx.fill();
  ctx.strokeStyle = '#3a2a20'; ctx.lineWidth = 2;
  for (let i = -24; i <= 24; i += 12) { ctx.beginPath(); ctx.moveTo(gx + i, CASTLE_Y - 58); ctx.lineTo(gx + i, CASTLE_Y); ctx.stroke(); }
  // torres
  for (const tx of [x0 + 18, x1 - 18]) {
    ctx.fillStyle = '#6b7385'; ctx.beginPath(); ctx.arc(tx, CASTLE_Y - 30, 24, 0, 7); ctx.fill();
    ctx.fillStyle = '#c62a35'; ctx.beginPath(); ctx.arc(tx, CASTLE_Y - 30, 18, 0, 7); ctx.fill();
    ctx.fillStyle = '#e5505a'; ctx.beginPath(); ctx.arc(tx - 5, CASTLE_Y - 35, 7, 0, 7); ctx.fill();
  }
  // bandeiras
  for (const bx of [gx - 70, gx + 70]) {
    ctx.fillStyle = '#c62a35'; ctx.fillRect(bx - 9, CASTLE_Y - 66, 18, 34);
    ctx.fillStyle = '#ffd27a'; ctx.beginPath(); ctx.arc(bx, CASTLE_Y - 50, 5, 0, 7); ctx.fill();
  }
  ctx.restore();
  // barra de vida
  const bw = 170, bx = (W - bw) / 2, by = 10;
  ctx.fillStyle = 'rgba(0,0,0,.55)'; roundRect(bx - 3, by - 3, bw + 6, 20, 9); ctx.fill();
  ctx.fillStyle = '#3b0d12'; roundRect(bx, by, bw, 14, 7); ctx.fill();
  if (hpFrac > 0) { ctx.fillStyle = '#ff4757'; roundRect(bx, by, Math.max(14, bw * hpFrac), 14, 7); ctx.fill(); }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (G) txt(`🏰 ${Math.ceil(G.castleHP)}`, W / 2, by + 7, 11, '#fff');
}

function drawCannon(x, recoil) {
  const y = CANNON_Y + recoil * 4;
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(x + 2, CANNON_Y + 18, 30, 10, 0, 0, 7); ctx.fill();
  // base
  ctx.fillStyle = '#eef2f8'; roundRect(x - 26, CANNON_Y, 52, 22, 6); ctx.fill();
  ctx.fillStyle = '#c3cad6'; ctx.fillRect(x - 26, CANNON_Y + 16, 52, 6);
  // cano
  const g = ctx.createLinearGradient(x - 14, 0, x + 14, 0);
  g.addColorStop(0, '#1f5fc7'); g.addColorStop(.45, '#6fb2ff'); g.addColorStop(1, '#1a4fa6');
  ctx.fillStyle = g; roundRect(x - 13, y - 30, 26, 40, 8); ctx.fill();
  ctx.fillStyle = '#123a80'; roundRect(x - 16, y - 34, 32, 9, 4); ctx.fill();
  ctx.fillStyle = '#0a1d40'; ctx.beginPath(); ctx.ellipse(x, y - 30, 10, 3.2, 0, 0, 7); ctx.fill();
  // rodas
  ctx.fillStyle = '#7b4a24';
  for (const wx of [x - 24, x + 24]) { ctx.beginPath(); ctx.arc(wx, CANNON_Y + 10, 9, 0, 7); ctx.fill();
    ctx.fillStyle = '#b07a44'; ctx.beginPath(); ctx.arc(wx, CANNON_Y + 10, 4, 0, 7); ctx.fill(); ctx.fillStyle = '#7b4a24'; }
}

function drawHUD() {
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  txt(`Fase ${save.level}`, 12, 46, 16, '#fff');
  ctx.textAlign = 'right';
  txt(`🪙 ${save.coins + (state !== 'play' ? 0 : 0)}`, W - 12, 46, 15, '#ffc93c');
  // vidas
  ctx.textAlign = 'left';
  const lf = clamp(G.lives / G.livesMax, 0, 1);
  ctx.fillStyle = 'rgba(0,0,0,.5)'; roundRect(TL + 4, H - 30, 110, 20, 9); ctx.fill();
  ctx.fillStyle = lf > .35 ? '#3ad27a' : '#ff6b3a'; roundRect(TL + 7, H - 27, Math.max(10, 104 * lf), 14, 7); ctx.fill();
  ctx.textAlign = 'center'; txt(`❤ ${Math.max(0, G.lives)}`, TL + 59, H - 20, 11, '#fff');
  // contagem de soldados
  ctx.textAlign = 'right';
  txt(`⚔ ${G.blues.length}`, TR - 8, H - 20, 15, '#9cc8ff');
  if (G.hint && state === 'play') {
    ctx.textAlign = 'center';
    ctx.globalAlpha = .6 + Math.sin(G.t * 5) * .4;
    txt('Segure e arraste para atirar', W / 2, CANNON_Y - 60, 16, '#fff');
    ctx.globalAlpha = 1;
  }
}

// ---------- Input ----------
function toWorldX(clientX) { const r = cv.getBoundingClientRect(); return (clientX - r.left) / r.width * W; }
cv.addEventListener('pointerdown', e => {
  if (!G || state !== 'play') return;
  cv.setPointerCapture(e.pointerId);
  G.firing = true; G.hint = false; G.aimX = toWorldX(e.clientX);
});
cv.addEventListener('pointermove', e => { if (G && (G.firing || e.pointerType === 'mouse')) G.aimX = toWorldX(e.clientX); });
const stop = () => { if (G) G.firing = false; };
cv.addEventListener('pointerup', stop); cv.addEventListener('pointercancel', stop);
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space' && G) { G.firing = true; G.hint = false; e.preventDefault(); } });
addEventListener('keyup', e => { keys[e.code] = false; if (e.code === 'Space' && G) G.firing = false; });

// ---------- Menus ----------
const $ = id => document.getElementById(id);
function renderMenu() {
  $('mCoins').textContent = save.coins;
  $('playLbl').textContent = `Jogar · Fase ${save.level}`;
  const box = $('ups'); box.innerHTML = '';
  for (const u of UPGRADES) {
    const lvl = save.up[u.id], maxed = lvl >= u.max, cost = upCost(u);
    const el = document.createElement('div'); el.className = 'up';
    el.innerHTML = `<div><b>${u.name} <small>Nv ${lvl}</small></b><small>${u.desc(lvl)}</small></div>`;
    const btn = document.createElement('button');
    btn.innerHTML = maxed ? 'MÁX' : `<span class="coin"></span>${cost}`;
    btn.disabled = maxed || save.coins < cost;
    btn.onclick = () => { if (save.coins >= cost && !maxed) { save.coins -= cost; save.up[u.id]++; persist(); renderMenu(); } };
    el.appendChild(btn); box.appendChild(el);
  }
}
function showEnd() {
  state = 'end';
  save.coins += G.earned;
  if (G.won) save.level++;
  persist();
  $('endCard').className = 'card ' + (G.won ? 'win' : 'lose');
  $('endTitle').textContent = G.won ? 'Vitória!' : 'Derrota';
  $('endSub').textContent = G.won ? `Castelo destruído! ${G.kills} inimigos derrotados.` : `O exército vermelho passou. Melhore seu canhão e tente de novo!`;
  $('endCoins').textContent = '+' + G.earned;
  $('nextLbl').textContent = 'Continuar';
  $('end').classList.add('show');
}
$('btnPlay').onclick = () => { $('menu').classList.remove('show'); startLevel(); };
$('btnNext').onclick = () => { $('end').classList.remove('show'); G = null; state = 'menu'; renderMenu(); $('menu').classList.add('show'); };

// ---------- Loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (G) {
    if (keys.ArrowLeft || keys.KeyA) G.aimX = clamp(G.aimX - 300 * dt, TL, TR);
    if (keys.ArrowRight || keys.KeyD) G.aimX = clamp(G.aimX + 300 * dt, TL, TR);
    if (state === 'play' || state === 'ending') update(dt);
  }
  render();
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize(); renderMenu();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
